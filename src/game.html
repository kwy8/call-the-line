<title>Call the Line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F0; --paper:#FFFFFF; --ink:#16221B; --muted:#5F6B63; --rule:#DCE1D8;
  --navy:#1F3A5F; --navy-ink:#F4F6F1; --ball:#D6E23A; --ball-dark:#A9B520;
  --good:#2F8F4E; --bad:#C8402F;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-block:12px 28px;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;flex:none}
.brand .logo{display:block;height:34px;width:auto}  /* src/brand/logo.svg, inlined so this file stays self-contained */
.hud{display:flex;gap:18px;align-items:flex-end;font-variant-numeric:tabular-nums}
.hud .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hud .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.strikes{display:flex;gap:4px;padding-block:6px 4px}
.strikes i{width:14px;height:14px;border-radius:50%;background:var(--ball);border:2px solid var(--ball-dark);display:inline-block}
.strikes i.hit{background:var(--bad);border-color:#8E2A1E}
.stage{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(22,34,27,.06)}
.tourney{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--rule);font-size:13px}
.tourney b{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.tourney b i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tourney .prog{color:var(--muted);font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;aspect-ratio:3/2;max-width:100%;touch-action:pan-y}
.timer{height:6px;background:var(--rule)}
.timer > i{display:block;height:100%;width:0%;background:var(--good)}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.quip{position:absolute;left:0;right:0;bottom:calc(100% + 8px);display:flex;justify-content:center;pointer-events:none;transition:opacity .15s}
.quip[hidden]{display:flex!important;opacity:0}
.quip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(22,34,27,.15)}
.quip b{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px;color:var(--bad)}
.quip.ump b{color:var(--good)}
.call{appearance:none;border:0;border-radius:10px;padding:20px 10px 16px;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .06s}
.call:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.call:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.call.in{background:var(--good)} .call.out{background:var(--bad)}
.call small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.1em;opacity:.8;margin-top:6px}
.call[disabled]{opacity:.4;cursor:default;box-shadow:none}
@media (hover:none){ .call small,.hint.kbd{display:none} .call{padding:22px 10px} }
.overlay{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;padding:12px;background:rgba(243,245,240,.96);text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;margin:auto 0}
.card h2{font-family:var(--display);font-weight:800;font-size:42px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.card h2.bad{color:var(--bad)} .card h2.good{color:var(--good)}
.card p{margin:0;color:var(--muted);max-width:36ch;text-wrap:pretty}
.btn{appearance:none;border:0;border-radius:6px;background:var(--navy);color:var(--navy-ink);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase;padding:11px 26px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy);padding-block:9px}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.hint{font-size:12px;color:var(--muted)}
#shareMsg{white-space:pre-line}
.btn.big{font-size:30px;padding:14px 56px}
.btn.small{font-size:17px;padding:11px 18px} .btn.ghost.small{padding-block:10px}
.linkbtn{appearance:none;border:0;background:none;color:var(--navy);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:12px 14px;margin:-8px 0}
.start{display:flex;flex-direction:column;align-items:center;gap:8px}
/* start-screen demo, two shots per loop: an IN that clips the line, then an OUT. Each shot runs in the first half of
   its keyframes; the OUT shot (.out) is offset half a cycle with a negative delay. */
.demo{position:relative;width:100%;max-width:320px;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(22,34,27,.12)}
.demo svg{display:block;width:100%;height:auto}
.demo .shot{--x0:176px;--y0:6px;--x1:152px;--y1:74px;--x2:160px;--y2:138px;--d:0s}
.demo .out{--x0:198px;--y0:4px;--x1:170px;--y1:62px;--x2:188px;--y2:138px;--d:-2.4s}
.demo .dm-pos,.demo .dm-h,.demo .dm-mark,.demo .dm-a{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:var(--d)}
.demo .dm-pos{animation-name:dm-pos} .demo .dm-h{animation-name:dm-h} .demo .dm-mark{animation-name:dm-mark} .demo .dm-a{animation-name:dm-a}
.demo .dm-t{position:absolute;left:12px;top:12px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1;opacity:0}
.demo .dm-q{font-size:24px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);animation:dm-q 2.4s linear infinite}
.demo .dm-a{font-size:22px;color:var(--good);background:#fff;border-radius:999px;padding:5px 12px 4px}
.demo .dm-a.out{color:var(--bad)}
@keyframes dm-pos{0%{transform:translate(var(--x0),var(--y0)) scale(.35);opacity:0} 3%{opacity:1} 16%{transform:translate(var(--x1),var(--y1)) scale(1)} 25%{transform:translate(var(--x2),var(--y2)) scale(1.7);opacity:1} 26%,100%{opacity:0}}
@keyframes dm-h{0%{transform:translateY(-10px)} 8%{transform:translateY(-22px)} 16%{transform:translateY(0)} 25%,100%{transform:translateY(-26px)}}
@keyframes dm-mark{0%,15.5%{opacity:0} 16.5%,47%{opacity:1} 49%,100%{opacity:0}}
@keyframes dm-q{0%,38%{opacity:0} 42%,60%{opacity:1} 64%,100%{opacity:0}}
@keyframes dm-a{0%,32%{opacity:0;transform:scale(.8)} 34%{opacity:1;transform:scale(1.08)} 36%,47%{opacity:1;transform:scale(1)} 49%,100%{opacity:0}}
.rules{width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.rules b{font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy);line-height:1}
.rules span{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;width:100%;max-width:300px}
.badge-cell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;line-height:1.2;text-align:center;color:var(--ink);font-weight:600}
.badge-cell svg{display:block}
.badge-cell.locked{color:var(--muted);font-weight:400}
.badge-cell.locked svg{filter:grayscale(1);opacity:.4}
.seatmap{display:block;width:100px;height:160px;margin-bottom:-4px}
.board{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.rankline{font-size:14px}
.lb{list-style:none;margin:0;padding:0;width:100%;max-width:300px;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
.lb li{display:grid;grid-template-columns:2.2em 1fr auto;gap:6px;padding:1px 8px;border-radius:4px;text-align:left}
.lb li:nth-child(odd){background:var(--paper)}
.lb li.me{background:var(--ball);font-weight:600}
.lb .r{color:var(--muted)} .lb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.name{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--rule);border-radius:6px;width:100%;max-width:260px;background:var(--paper);color:var(--ink)}
input.name:focus{outline:none;border-color:var(--navy)}
.subhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.badge-toast{position:absolute;left:0;right:0;top:46px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.practice-panel{position:absolute;left:0;right:0;top:46px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.practice-panel span{background:rgba(255,255,255,.92);border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);box-shadow:0 1px 3px rgba(22,34,27,.12);white-space:nowrap}
.practice-panel b{font-weight:600}
.picker{display:block;width:150px;height:240px;touch-action:manipulation;cursor:pointer}
.picker .chair:focus{outline:none} .picker .chair:focus-visible .dot{stroke:var(--ink);stroke-width:2}
.levels{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.levels button{appearance:none;font:inherit;font-size:14px;font-weight:600;padding:9px 14px;min-height:40px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.badge-toast span{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--ball);border-radius:999px;padding:4px 14px 4px 4px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 6px rgba(22,34,27,.25);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--display);font-size:15px;font-weight:800}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--navy);color:var(--navy-ink)}
.tag.bad{background:var(--bad)} .tag.good{background:var(--good)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--rule);display:inline-block}
.dots i.y{background:var(--good)} .dots i.n{background:var(--bad)}
.eagle{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px}
.eagle canvas{width:170px;height:170px;aspect-ratio:1;border-radius:6px}
.eagle .seat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.eagle .verdict{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase}
.eagle .mm{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);line-height:1.1}
.eagle .yours{font-size:13px;margin-top:8px;color:var(--muted)}
.eagle .yours b{color:var(--ink)}
.ladder{display:flex;align-items:center;width:100%;padding:4px 6px}
.ladder .st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.ladder .st i{width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--rule)}
.ladder .st.now i{width:20px;height:20px;box-shadow:0 0 0 2px var(--navy)}
.ladder .st.done i{opacity:.45}
.ladder .st span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ladder .st.now span{color:var(--ink);font-weight:600}
.ladder .ln{flex:1;height:2px;background:var(--rule);margin-bottom:16px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.tool{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding-inline:6px;font-size:19px}
.btn.tool svg{flex:none;width:18px;height:18px}
.btn.tool[disabled]{opacity:.4;cursor:default}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
footer button{appearance:none;border:0;background:none;color:var(--navy);font:inherit;text-decoration:underline;cursor:pointer;display:inline-block;min-height:44px;padding:13px 4px;margin:-13px -4px}
footer button[disabled]{opacity:.4;text-decoration:none;cursor:default}
footer button.confirm{color:var(--bad);font-weight:600}
footer .legal a{color:inherit;text-decoration:underline;display:inline-block;min-height:44px;padding:13px 2px;margin:-13px -2px}  /* muted like the text, 44px tall to tap */
.toast{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.06em;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.35)}
.toast small{display:block;font-size:20px;letter-spacing:.1em;margin-top:6px}
@media (max-width:480px){
  canvas{aspect-ratio:4/5}
  .overlay{padding:10px}
  .card{gap:8px}
  .card h2{font-size:30px}
  .rules{padding:8px 10px;gap:4px 10px} .rules b{font-size:18px} .rules span{font-size:13px;line-height:1.3}
  .chips{gap:4px} .chip{font-size:11px;padding:3px 8px}
  .btn{font-size:20px;padding:10px 22px} .btn.ghost{padding-block:8px}
  #rescue{font-size:17px;padding:12px 14px}
  .tag{font-size:10px}
  /* logo and HUD share one line on a 390px phone: smaller numbers, and Best (also on the start screen) is hidden */
  header{flex-wrap:nowrap;align-items:center}
  .brand .logo{height:20px}
  .hud{gap:8px} .hud .v{font-size:18px} .hud .k{font-size:9px;letter-spacing:.06em} .hud .best{display:none}
  .strikes{gap:3px;padding-block:4px 2px} .strikes i{width:12px;height:12px}
  .call{font-size:34px}
  .card h2{font-size:34px}
  .eagle{grid-template-columns:130px 1fr} .eagle canvas{width:130px;height:130px}
  .eagle .verdict{font-size:32px}
  .ladder .st span{display:none} .ladder .st.now span{display:block}
  .toast{font-size:36px}
}
@media (max-width:359px){ .eagle{grid-template-columns:1fr;justify-items:center;text-align:center} }
@media (prefers-reduced-motion:reduce){ .call{transition:none} .demo *{animation:none!important} .demo .dm-pos,.demo .out .dm-mark{opacity:0} .demo .dm-q{opacity:1} }
</style>

    <div class="hud">
      <div><div class="k">Score</div><div class="v" id="score">0</div></div>
      <div><div class="k">Call</div><div class="v" id="callNo">–</div></div>
      <div><div class="k">Streak</div><div class="v" id="streak">0</div></div>
      <div class="best"><div class="k">Best</div><div class="v" id="best">0</div></div>

    </div>
  </header>

  <div class="stage">
    <div class="tourney">
      <b><i id="tSw"></i><span id="tName">Riverside Club Open</span></b>
      <span class="prog" id="tProg">Clay</span>
    </div>
    <canvas id="court" width="720" height="480" aria-label="Line judge view of a tennis sideline"></canvas>
    <div class="timer" id="timerTrack"><i id="timer"></i></div>
    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
    <div class="badge-toast" id="badgeToast" hidden aria-live="polite"></div>
    <div class="practice-panel" id="practicePanel" hidden aria-live="polite"></div>
  </div>

  <div class="calls">
    <div class="quip" id="quip" hidden aria-live="polite"></div>
    <button class="call in" id="btnIn" disabled>In<small>← / I</small></button>
    <button class="call out" id="btnOut" disabled>Out<small>→ / O</small></button>
  </div>

  <div class="tools">
    <button class="btn ghost tool" id="rulesBtn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="currentColor"><circle cx="3.5" cy="5" r="1.6"/><circle cx="3.5" cy="10" r="1.6"/><circle cx="3.5" cy="15" r="1.6"/></g><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7.5 5h10M7.5 10h10M7.5 15h10"/></g></svg>Rules</button>
    <button class="btn ghost tool" id="statsBtn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><rect x="2" y="11" width="4" height="7" rx="1"/><rect x="8" y="6" width="4" height="12" rx="1"/><rect x="14" y="2" width="4" height="16" rx="1"/></svg>Stats</button>
    <button class="btn ghost tool" id="mute" type="button" aria-pressed="false"></button>

// ---------- Camera: in line with the sideline, eye height 1.1 m ----------
const cam = { x:LINE_W/2, y:-J.behind, z:J.eye, pitch:0, yaw:0, flip:false };
const fwd = (x,y) => x*Math.sin(cam.yaw)+y*Math.cos(cam.yaw);   // position along the direction the judge faces
// tilt the camera down to a point at forward position f (for yaw 0 that is simply a y coordinate)
function setPitch(f){ const tall=H>W; cam.pitch=Math.atan2(cam.z, (tall?f*0.85:f)-fwd(cam.x,cam.y)); }
function proj(x,y,z){
  const ox=x-cam.x, oy=y-cam.y, cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const dx=ox*cy-oy*sy, dy=ox*sy+oy*cy, dz=z-cam.z, c=Math.cos(cam.pitch), s=Math.sin(cam.pitch);  // dx right, dy forward
  const depth=dy*c-dz*s, up=dy*s+dz*c, d=Math.max(depth,0.05);

}
function poly(pts, fill){
  cx.beginPath();
  pts.forEach((p,i)=>{ const q=proj(p[0],p[1],p[2]||0); i?cx.lineTo(q.sx,q.sy):cx.moveTo(q.sx,q.sy); });
  cx.closePath(); cx.fillStyle=fill; cx.fill();
}
function shade(hex, k){ // darken/lighten a hex colour by factor k

  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

// ---------- Crowd (fixed seed so it doesn't shimmer) ----------
const CROWD = []; (function(){ let s=7; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  const cols=['#5B6B7C','#8A6E5A','#A9A39A','#6E7F6A','#B08B7E','#4F5D73','#C9BFB0','#7A6A80'];
  for(let i=0;i<420;i++) CROWD.push({x:r(), row:Math.floor(r()*9), o:r(), c:cols[Math.floor(r()*cols.length)]}); })();

// ---------- Scene ----------
let ball=null, trail=[];
function drawScene(t){
  const T=TIERS[S.tier];
  cx.setTransform(dpr,0,0,dpr,0,0);
  const hz = proj(cam.x+400*Math.sin(cam.yaw), cam.y+400*Math.cos(cam.yaw), 0).sy;
  // sky
  const C = ball ? ball.cond : S.cond, night = C==='night';
  const skyCols = night ? ['#0B1524','#1E2C40'] : C==='late' ? ['#F2E2CC','#F8EEDD'] : ['#EAF0F4','#F6F7F2'];
  const sky=cx.createLinearGradient(0,0,0,hz-70); sky.addColorStop(0,skyCols[0]); sky.addColorStop(1,skyCols[1]);
  cx.fillStyle=sky; cx.fillRect(0,0,W,hz);

  cx.fillStyle='rgba(0,0,0,.05)'; cx.fillRect(0,top,W,78);

  cx.fillStyle='#1F3A5F'; cx.fillRect(0,hz-8,W,9);
  cx.fillStyle='rgba(255,255,255,.55)'; cx.font='800 7px "Barlow Condensed", sans-serif'; cx.textAlign='left';
  for(let x=-20;x<W;x+=120) cx.fillText('CALL THE LINE', x, hz-1.5);
  drawCourt(T, hz, ball ? ball.match : S.match, C);
  if(replay && replay.mark) drawMark(ball);   // ghost replay: the bounce mark on the court
  // ball
  if(ball && ball.vis){
    const sh=proj(ball.x,ball.y,0), r0=FPX*BALL_R/Math.max(sh.d,0.2);
    if(C==='late'){ cx.fillStyle='rgba(0,0,0,.24)'; cx.beginPath(); cx.ellipse(sh.sx+r0*1.6,sh.sy,r0*2.8,r0*0.4,0,0,7); cx.fill(); }  // low sun: long shadow
    else { cx.fillStyle='rgba(0,0,0,.3)'; cx.beginPath(); cx.ellipse(sh.sx,sh.sy,r0*1.1,r0*0.45,0,0,7); cx.fill(); }

    if(night){ cx.shadowColor='rgba(240,255,140,.7)'; cx.shadowBlur=r*1.2; }  // under the floodlights the ball pops

    cx.fillStyle='#D6E23A'; cx.font='800 12px "Barlow Condensed", sans-serif'; cx.textAlign='left'; cx.fillText('REPLAY · ¼ SPEED', 18, 25);
  }
}
function drawCourt(T, hz, match, cond){ // the whole doubles court, from any seat, in the match conditions
  const L=-SINGLES_W, BW=LINE_W, DL=L-ALLEY, DR=ALLEY+LINE_W, across=cam.yaw!==0;  // DL..DR: outer edges of the doubles sidelines
  // nothing behind the judge is drawn: facing down the court that means y < yN, facing across it x > cam.x-1.2
  const yN = across ? -15 : cam.y+1.2, yF=60, y0=Math.max(0,yN);
  const night = cond==='night', out = night ? shade(T.out,0.6) : T.out;   // floodlights: the court is lit, its surrounds fall away
  const line = cond==='late' ? mix(T.line, T.court, 0.35) : T.line;      // low sun: washed-out lines
  if(across) poly([[-25,-15],[cam.x-1.2,-15],[cam.x-1.2,yF],[-25,yF]], out);
  else poly([[-20,yN],[14,yN],[14,yF],[-20,yF]], out);
  poly([[DL,y0],[DR,y0],[DR,FAR_BASE],[DL,FAR_BASE]], night ? shade(T.court,1.06) : T.court);
  if(cond==='damp') poly([[DL,y0],[DR,y0],[DR,FAR_BASE],[DL,FAR_BASE]], 'rgba(10,40,25,.12)');  // wet sheen
  if(T.surf===SURF.clay){ for(let y=0;y<FAR_BASE;y+=0.6) if(y>=y0) poly([[DL,y],[DR,y],[DR,y+0.25],[DL,y+0.25]],'rgba(255,255,255,.04)'); }
  if(T.surf===SURF.grass){ for(let y=0;y<FAR_BASE;y+=2) if(y>=y0) poly([[DL,y],[DR,y],[DR,y+1],[DL,y+1]],'rgba(255,255,255,.06)'); }
  const hz2=cx.createLinearGradient(0,hz,0,H); hz2.addColorStop(0,'rgba(255,255,255,.28)'); hz2.addColorStop(0.35,'rgba(255,255,255,0)');
  cx.fillStyle=hz2; cx.fillRect(0,hz,W,H-hz);
  // baselines across the full doubles width; near baseline outer edge at y=0, running into the court to y=BW
  if(yN<0) poly([[DL,0],[DR,0],[DR,BW],[DL,BW]], line);
  const FBW=SPORT.court.farBaselineWidth;
  poly([[DL,FAR_BASE],[DR,FAR_BASE],[DR,FAR_BASE+FBW],[DL,FAR_BASE+FBW]], line);
  // singles and doubles sidelines, both sides
  for(const x of [0, L, ALLEY, DL]) poly([[x,y0],[x+LINE_W,y0],[x+LINE_W,FAR_BASE+FBW],[x,FAR_BASE+FBW]], line);
  // service lines (singles width) and centre service line
  poly([[L,SVC1],[LINE_W,SVC1],[LINE_W,SVC1+LINE_W],[L,SVC1+LINE_W]], line);
  poly([[L,SVC2],[LINE_W,SVC2],[LINE_W,SVC2+LINE_W],[L,SVC2+LINE_W]], line);
  poly([[CENTRE,SVC1],[CENTRE+LINE_W,SVC1],[CENTRE+LINE_W,SVC2],[CENTRE,SVC2]], line);
  // late afternoon: the shadow of the stands falls across the court in a long diagonal band (court area only, so it is
  // always in front of the judge)
  if(cond==='late'){ const yl=x=>-2-0.9*(x-6); poly([[DR,yl(DR)],[DR,yl(DR)+4],[DL,yl(DL)+4],[DL,yl(DL)]], 'rgba(15,20,35,.30)'); }
  if(night){ const gl=cx.createRadialGradient(W/2,H*0.6,0,W/2,H*0.6,W*0.7); gl.addColorStop(0,'rgba(255,255,235,.10)'); gl.addColorStop(1,'rgba(255,255,235,0)'); cx.fillStyle=gl; cx.fillRect(0,0,W,H); }
  // net sagging from its post height to its centre height: singles sticks, or doubles posts outside the doubles lines
  const N=SPORT.net, pl = match==='doubles' ? DL-N.postOutside : L-N.singlesStick, pr = match==='doubles' ? DR+N.postOutside : N.singlesStick;
  poly([[pl,NET_Y,0],[pr,NET_Y,0],[pr,NET_Y,N.postHeight],[CENTRE,NET_Y,N.centreHeight],[pl,NET_Y,N.postHeight]], across ? 'rgba(20,30,40,.2)' : 'rgba(20,30,40,.5)');
  poly([[pl,NET_Y,N.postHeight],[CENTRE,NET_Y,N.centreHeight],[CENTRE,NET_Y,N.tapeAtCentre],[pl,NET_Y,N.tapeAtPost]], '#F2F2F2');
  poly([[CENTRE,NET_Y,N.centreHeight],[pr,NET_Y,N.postHeight],[pr,NET_Y,N.tapeAtPost],[CENTRE,NET_Y,N.tapeAtCentre]], '#F2F2F2');
  poly([[pl-N.postHalfWidth,NET_Y,0],[pl+N.postHalfWidth,NET_Y,0],[pl+N.postHalfWidth,NET_Y,N.postTop],[pl-N.postHalfWidth,NET_Y,N.postTop]], '#2A2F33');
  poly([[pr-N.postHalfWidth,NET_Y,0],[pr+N.postHalfWidth,NET_Y,0],[pr+N.postHalfWidth,NET_Y,N.postTop],[pr-N.postHalfWidth,NET_Y,N.postTop]], '#2A2F33');
}

// ---------- Ball ----------
let R=Math.random; // swapped for a seeded generator during the daily challenge
const rnd=(a,b)=>a+R()*(b-a);
function newBall(){
  const T=TIERS[S.tier], seat=SEATS[S.seat], view=seat.view, V=seatGeom(view, S.match);
  cam.x=V.cam[0]; cam.y=V.cam[1]; cam.yaw=V.yaw; cam.flip=!!seat.flip;
  const v=rnd(T.speed[0],T.speed[1]), vy=-v;   // court speed, towards the judge's end
  const markL = MARK_L*(CONDITIONS[S.cond].skid||1);  // damp grass: the ball skids further, the mark is longer
  // margin between the mark's inner edge and the line's outer edge: negative = in, positive = out
  const m = R()<0.22 ? rnd(0.06,0.22)*(R()<0.5?-1:1) : rnd(T.margin[0],T.margin[1])*(R()<0.5?-1:1);
  // Landing spot first, then a hitter who can reach it. along: distance along the judged line from the judge's end (down
  // the sideline, or across the court along the baseline/service line, scaled to fit inside its judged length). If no
  // plausible origin turns up for a spot (a fast ball can't dip into mid-court over the net), the spot moves deeper.
  const H=SPORT.hitter, Z=view==='svc' ? H.serve : H.ground;
  let along=rnd(T.near[0],T.near[1]), shot=null, best=null;
  for(let spot=0; spot<40 && !shot; spot++){
    if(spot) along=rnd(Math.min(H.deepest,along), along);
    const at = view==='side' ? along : V.end-0.7*V.len/SINGLES_W*along;
    for(let i=0; i<H.tries && !shot; i++){
      const side = view==='svc' ? (at>CENTRE ? -1 : 1) : 0;   // serve: from the half diagonally opposite the box
      const xo = CENTRE+(side ? side*rnd(0,Z.x) : rnd(-Z.x,Z.x)), zo=rnd(Z.z[0],Z.z[1]), dip=G*rnd(Z.dip[0],Z.dip[1]);
      const yo = FAR_BASE+rnd(Math.max(Z.behindBase[0], NET_Y+Z.pastNet-FAR_BASE), Z.behindBase[1]);
      const c = aimShot({ xo, yo, zo, dip }, V, at, m, markL, v);
      if(c.ok) shot=c; else if(!best || c.clear>best.clear) best=c;
    }
  }
  shot ||= best;   // never seen in scripts/check.mjs; keeps the game going if it ever happens
  const { xL, yL, vx, ux, uy, ext, xo, yo, zo, dip, fall } = shot;
  setPitch(fwd(xL,yL)+V.aim);  // centre the view just past the landing spot on the line
  const spawn=Math.min(14, yo-yL);   // the ball comes into view at most 14 m before it lands
  ball={ xL, yL, vx, vy, a:fall, dip, b:SPORT.ball.bounce*fall, t0:-spawn/v, xo, yo, zo, x:0,y:0,z:0, vis:true, ux, uy, ext, markL, cond:S.cond, seat:S.seat, view, geo:V, match:S.match, flip:!!seat.flip, m, isIn:m<0, squash:1 };
  trail=[];
}
// The shot from origin o = { xo, yo, zo, dip } at court speed v to the spot `at` along the judged line, `m` from it.
// The landing point depends on the mark's half-extent across the line, which depends on the direction of travel, which
// depends on the landing point: a few rounds settle it to well under a micron. In the air the ball keeps its court
// velocity and falls on a parabola with downward acceleration dip, from zo at the origin to 0 at the bounce; fall is its
// falling speed at the bounce. ok: it clears the net by the hitter's rule, between the posts; clear: height to spare (m).
function aimShot(o, V, at, m, markL, v){
  let ux=0, uy=-1, ext=0, xL=0, yL=0;
  for(let k=0;k<4;k++){
    // half-extent of the elongated mark across the judged line
    ext = V.axis==='x' ? Math.hypot(markL/2*ux, MARK_W/2*uy) : Math.hypot(markL/2*uy, MARK_W/2*ux);
    // the line's outer edge is V.line; out is x > V.line (sideline) or y < V.line (baseline, service line). In a singles
    // match the doubles alley lies beyond the singles sideline, so a ball there is out
    xL = V.axis==='x' ? V.line+m+ext : at; yL = V.axis==='x' ? at : V.line-m-ext;
    const len=Math.hypot(xL-o.xo, yL-o.yo); ux=(xL-o.xo)/len; uy=(yL-o.yo)/len;
  }
  const D=o.yo-yL, Tf=D/v, vx=(xL-o.xo)/Tf, fall=(o.zo+0.5*o.dip*Tf*Tf)/Tf;
  const net=netPass(o, xL, yL, v), N=SPORT.hitter.net;
  const clear = Math.abs(net.x-CENTRE)>N.halfWidth ? -Infinity : net.z-netNeed(net.x);
  return { ...o, xL, yL, vx, ux, uy, ext, fall, net, clear, ok: clear>=0 };
}
// Where a ball from o, landing at (xL, yL) at court speed v, crosses the net (y = NET_Y): x and the ball centre's height
function netPass(o, xL, yL, v){
  const D=o.yo-yL, d=NET_Y-yL, s=d/D;
  return { x: xL+(o.xo-xL)*s, z: o.zo*s+0.5*o.dip*d*(D-d)/(v*v) };
}
// The least height the ball must have over the net at x: net.centre at the centre line, rising linearly to net.post at the posts
function netNeed(x){ const N=SPORT.hitter.net; return N.centre+(N.post-N.centre)*Math.min(1, Math.abs(x-CENTRE)/N.halfWidth); }
const SQUASH = 0.045;  // seconds the flattened ball shows at the bounce
function stepBall(t){
  const b=ball;
  // The ball is held flat on its contact point for the squash, then flies on. Without the hold the squash frame shows it
  // where it has moved to: from the end of a baseline or service line that is ~0.6 m a frame along the judged axis, and
  // even on the sideline the ball drifts several cm sideways, enough to flip a close call.
  const bounce = t>=0 && t<SQUASH;
  if(bounce){ b.x=b.xL; b.y=b.yL; b.z=0; }
  else { const tf = t>=SQUASH ? t-SQUASH : t;
    b.x=b.xL+b.vx*tf; b.y=b.yL+b.vy*tf;
    b.z = tf<0 ? -b.a*tf-0.5*b.dip*tf*tf : Math.max(0, b.b*tf-0.5*G*tf*tf); }
  b.squash = bounce ? (b.cond==='damp' ? 1.55 : 1.35) : 1;
  b.vis = fwd(b.x,b.y)-fwd(cam.x,cam.y) > 0.4;
  trail.push({x:b.x,y:b.y,z:b.z}); if(trail.length>4) trail.shift();
}

// ---------- Audio ----------
function unlockAudio(){ // mobile browsers only start audio from a user gesture
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const b=S.sound.createBuffer(1,1,22050), src=S.sound.createBufferSource(); src.buffer=b; src.connect(S.sound.destination); src.start(0);
    if(S.sound.state==='running') UNLOCK_EVENTS.forEach(ev=>document.removeEventListener(ev, unlockAudio));
  }catch(e){}
}
const UNLOCK_EVENTS=['pointerdown','pointerup','touchend','click','keydown'];
UNLOCK_EVENTS.forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
// The bounce "pock". Started when the bounce is noticed, it reaches the speakers one frame late (the bounce is seen
// on the first frame after it) plus the audio output delay (~30 ms on built-in speakers, far more on Bluetooth), so it
// trails the picture. Instead each ball's pock is scheduled ahead, for one frame after the bounce, when the bounce frame
// is on screen. getOutputTimestamp maps audio time to performance.now() at the speaker, so output delay is included.
const POCK_AFTER_BOUNCE_MS = 16;
let pockVoice=null;   // the scheduled pock for the ball in flight, so it can be cancelled
function pock(when){  // play the pock at audio-context time `when` (default: now)
  if(S.muted) return null;
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const ac=S.sound, o=ac.createOscillator(), g=ac.createGain(), t=Math.max(when||0, ac.currentTime);
    o.type='triangle'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(140,t+0.08);
    g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.13);
    return o;
  }catch(e){ return null; }
}
// Schedule the pock for performance time `bounceMs`; returns false when it can't (no running audio yet, muted, or the
// moment is too close), and the frame loop then plays it when it sees the bounce, as before.
function schedulePock(bounceMs){
  cancelPock();
  const ac=S.sound;
  if(S.muted || !ac || ac.state!=='running') return false;
  const target=bounceMs+POCK_AFTER_BOUNCE_MS, ts=ac.getOutputTimestamp && ac.getOutputTimestamp();
  const when = ts && ts.performanceTime ? ts.contextTime+(target-ts.performanceTime)/1000
                                        : ac.currentTime+(target-performance.now())/1000-(ac.outputLatency||ac.baseLatency||0);
  if(!(when > ac.currentTime+0.02)) return false;
  pockVoice=pock(when);
  return !!pockVoice;
}
function cancelPock(){ if(pockVoice){ try{ pockVoice.stop(0); }catch(e){} pockVoice=null; } }
// Reactions: the crowd murmurs after an overrule, the umpire chimes after a close good call
function murmur(){ // ~1 s of low filtered noise
  if(S.muted) return;
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const ac=S.sound, t=ac.currentTime, len=Math.floor(ac.sampleRate*1.1), buf=ac.createBuffer(1,len,ac.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const src=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    src.buffer=buf; f.type='bandpass'; f.frequency.value=320; f.Q.value=0.8;
    g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.28,t+0.25); g.gain.exponentialRampToValueAtTime(0.001,t+1.05);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+1.1);
  }catch(e){}
}
function chime(){ // two soft rising notes
  if(S.muted) return;
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const ac=S.sound, t=ac.currentTime;
    [[660,0],[990,0.09]].forEach(([hz,dt])=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=hz;
      g.gain.setValueAtTime(0.001,t+dt); g.gain.exponentialRampToValueAtTime(0.18,t+dt+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.22);
      o.connect(g); g.connect(ac.destination); o.start(t+dt); o.stop(t+dt+0.24);
    });
  }catch(e){}
}

// ---------- Loop ----------
let raf=0, tStart=0, callWindow=1, callT=0, resolved=false, eagleTimer=0;
function loop(ts){
  const t=(ts-tStart)/1000+ball.t0;
  if(S.phase==='flight'||S.phase==='window'){
    stepBall(t);
    if(S.phase==='flight'&&t>=0){ S.phase='window'; callT=ts; if(!pockVoice) pock(); pockVoice=null; setButtons(true); }
    if(S.phase==='window'){
      const el=(ts-callT)/1000, left=Math.max(0,1-el/callWindow);
      const bar=$('timer'); bar.style.width=left*100+'%'; bar.style.background = left<0.3?'var(--bad)':left<0.6?'#D28B1C':'var(--good)';
      if(el>=callWindow) resolve(null, el);
    }
  }
  drawScene(ts/1000);
  if(S.phase==='flight'||S.phase==='window') raf=requestAnimationFrame(loop);
}
function startPoint(){
  S.call++;
  if(S.mode==='daily'){ S.tier=DAILY_LEVELS[S.daily.level].tier; $('tSw').style.background=TIERS[S.tier].court; }
  const T=TIERS[S.tier], practice=S.mode==='practice';
  $('tProg').textContent = practice ? `${T.surf} · Practice · ball ${S.call}` : `${T.surf} · ${cap(S.match)} · call ${S.call} of ${S.mode==='daily'?DAILY_N:T.calls}`;
  newBall(); callWindow=practice ? Infinity : T.win; resolved=false;   // practice: no timer
  CG.start();
  $('timerTrack').style.visibility = practice ? 'hidden' : '';
  $('timer').style.width='100%'; setButtons(false); hideOverlay(); toast('');
  clearTimeout(quipTimer); $('quip').hidden=true;
  S.phase='flight'; tStart=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); hud();
  schedulePock(tStart-ball.t0*1000);   // the bounce happens at t = 0, i.e. -t0 seconds after the ball appears
}
function setButtons(on){ $('btnIn').disabled=!on; $('btnOut').disabled=!on; $('rulesBtn').disabled=on; $('statsBtn').disabled=on; }
function makeCall(c){ if(S.phase!=='window'||resolved) return; resolve(c,(performance.now()-callT)/1000); }
function resolve(call, elapsed){
  resolved=true; S.phase='review'; setButtons(false);
  cancelAnimationFrame(raf); drawScene(performance.now()/1000);  // last frame; nothing moves under the cards
  const right = call!==null && (call==='in')===ball.isIn;
  if(S.mode==='practice'){ // no score, no strikes, no stats or badges: just the call and this session's tally
    toast(call===null?'No call':CALL[call].toLowerCase(), right?'Correct':'Overruled');
    practiceTally(right);
  }else if(right){
    S.streak++;
    const mult=1+Math.min(4,Math.floor(S.streak/3))*0.5, speed=Math.round(100*Math.max(0,1-elapsed/callWindow));
    const pts=Math.round((100+speed)*mult); S.score+=pts;
    toast(CALL[call].toLowerCase(), `+${pts}`);
  }else{
    S.streak=0; if(S.mode!=='daily') S.over++;
    toast(call===null?'No call':CALL[call].toLowerCase(), 'Overruled');
  }
  if(S.mode==='daily') dailyRecord(right, call===null ? null : elapsed);
  if(S.mode!=='practice') updateStats(st=>{
    st.calls++; if(call!==null){ st.rtSum+=elapsed; st.rtN++; }
    if(right){ st.correct++; st.bestStreak=Math.max(st.bestStreak,S.streak); const mm=Math.abs(ball.m)*1000; if(st.closest===null||mm<st.closest) st.closest=mm; }
  });
  if(!right){ murmur(); quip('Player', pickQuote(), false); }
  else if(Math.abs(ball.m)<=0.005){ chime(); quip('Umpire', SPORT.umpire, true); }
  hud();
  // the ghost replay before the Eagle-Eye review: on every ball in practice, otherwise only after an overrule (a wrong
  // call or no call); a correct call goes to the review after a short pause, as before
  const review=()=>showEagle(right,call,elapsed);
  if(S.mode==='practice' || !right) startReplay(review); else eagleTimer=setTimeout(review, 700);
}
let lastQuote=-1, quipTimer=0;
function pickQuote(){ let i; do{ i=Math.floor(Math.random()*QUOTES.length); }while(i===lastQuote); lastQuote=i; return QUOTES[i]; }
function quip(who, line, ump){
  const el=$('quip'); el.innerHTML=`<span><b>${who}</b>“${line}”</span>`; el.classList.toggle('ump',ump); el.hidden=false;
  clearTimeout(quipTimer); quipTimer=setTimeout(()=>{ el.hidden=true; },1500);
}
function toast(big, small){ const el=$('toast'); el.innerHTML = big ? `${big}<small>${small||''}</small>` : ''; el.hidden=!big; }

// ---------- Ghost replay ----------
// After an overrule (every call in practice): the last half second of the ball's flight again at quarter speed, from the same seat, with the
// bounce mark drawn on the court the moment it lands; held for 0.4 s, then the review card. Space, Enter or a tap
// skips it. It replays the very ball that was called (same object, no random draws), so nothing about play changes.
const REPLAY = { span:0.5, speed:0.25, hold:0.4 };
let replay=null;   // { t0, wall, mark, markAt, raf, done }
function startReplay(done){
  stopReplay();
  replay={ t0:Math.max(ball.t0, -REPLAY.span), wall:null, mark:false, markAt:0, raf:0, done };
  trail=[];
  const frame=ts=>{
    if(!replay) return;
    if(replay.wall===null) replay.wall=ts;
    const t=replay.t0+(ts-replay.wall)/1000*REPLAY.speed;
    if(t>=0 && !replay.mark){ replay.mark=true; replay.markAt=ts; toast(''); }   // touchdown: the mark appears, the result text clears
    stepBall(Math.min(t,0));
    if(replay.mark) ball.vis=false;               // the ball lifts away so the mark can be read
    drawScene(ts/1000);
    if(replay.mark && ts-replay.markAt>=REPLAY.hold*1000){ finishReplay(); return; }
    replay.raf=requestAnimationFrame(frame);
  };
  replay.raf=requestAnimationFrame(frame);
}
function finishReplay(){ if(!replay) return; const done=replay.done; stopReplay(); done(); }
function stopReplay(){ if(!replay) return; cancelAnimationFrame(replay.raf); replay=null; }
// the bounce mark as the review measures it (length along the ball's travel, width across), on the ground plane
function drawMark(b){
  cx.beginPath();
  for(let k=0;k<=32;k++){
    const a=k/32*Math.PI*2, l=b.markL/2*Math.cos(a), w=MARK_W/2*Math.sin(a);
    const q=proj(b.xL+l*b.ux-w*b.uy, b.yL+l*b.uy+w*b.ux, 0);
    k ? cx.lineTo(q.sx,q.sy) : cx.moveTo(q.sx,q.sy);
  }
  cx.closePath(); cx.fillStyle='rgba(214,226,58,.6)'; cx.fill();
  cx.lineWidth=1; cx.strokeStyle='#FFFFFF'; cx.stroke();
}

// ---------- Practice ----------
// No timer, strikes or score; the player picks a seat and a level, then gets endless balls. The session's accuracy is
// split by how far down the judged line the ball landed, from the judge's end. Nothing here touches stats, badges,
// the best score or the daily.
let practiceSeat='sideline-right', practiceLevel=0, PR=null;
const PRACTICE_BANDS = [ { key:'near', name:'Near', max:4 }, { key:'mid', name:'Mid', max:8 }, { key:'far', name:'Far', max:Infinity } ];
function landDistance(b){ return b.geo.axis==='x' ? b.yL : (b.geo.end+LINE_W)-b.xL; }   // metres along the line from the judge's end
function practiceTally(right){
  const d=landDistance(ball), band=PRACTICE_BANDS.find(x=>d<x.max).key;
  PR[band].n++; if(right) PR[band].ok++;
  practicePanel();
}
function practicePanel(){
  const el=$('practicePanel'); el.hidden=false;
  el.innerHTML=`<span title="Accuracy this session by landing distance down the line: near under 4 m, mid 4 to 8 m, far over 8 m">${PRACTICE_BANDS.map(x=>{
    const t=PR[x.key]; return `${x.name} <b>${t.n?Math.round(100*t.ok/t.n)+'%':'–'}</b>${t.n?` (${t.ok}/${t.n})`:''}`; }).join(' · ')}</span>`;
}
// Court diagram with the four seats' chairs to choose from (same layout as the intro cards' diagram, singles, scaled
// up); a seat with two views shows the chair of its first
function seatPicker(selected){
  const k=4.4, yB=132, L=-SINGLES_W, P=([x,y])=>[50+(x-CENTRE)*k, yB-y*k].map(v=>+v.toFixed(1));
  const [rx,ry]=P([L-ALLEY,FAR_BASE]), [rx2,ry2]=P([ALLEY+LINE_W,0]);
  const ln=(p,q)=>{ const [u,v]=P(p),[w,z]=P(q); return `<line x1="${u}" y1="${v}" x2="${w}" y2="${z}"/>`; };
  const place=id=>{ const s=SEATS[id], V=seatGeom(s.view,'singles'), tf=([x,y])=>[s.flip||s.far ? -SINGLES_W-x : x, s.far ? FAR_BASE-y : y];
    const line=V.axis==='x' ? [[V.line-LINE_W/2,0],[V.line-LINE_W/2,FAR_BASE]] : [[V.end+LINE_W/2,V.line+LINE_W/2],[V.end-V.len+LINE_W/2,V.line+LINE_W/2]];
    return { line:line.map(p=>P(tf(p))), chair:P(tf(V.cam)) }; };
  const sel=place(SEAT_CHOICES[selected][0]);
  return `<svg class="picker" id="picker" viewBox="0 0 100 160" role="radiogroup" aria-label="Choose your chair">
    <rect x="${rx}" y="${ry}" width="${+(rx2-rx).toFixed(1)}" height="${+(ry2-ry).toFixed(1)}" fill="var(--paper)" stroke="var(--muted)" stroke-width="1"/>
    <g stroke="var(--muted)" stroke-width="1">${ln([0,0],[0,FAR_BASE])}${ln([L,0],[L,FAR_BASE])}${ln([L,SVC1],[0,SVC1])}${ln([L,SVC2],[0,SVC2])}${ln([CENTRE,SVC1],[CENTRE,SVC2])}</g>
    <g stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2">${ln([ALLEY+1,NET_Y],[L-ALLEY-1,NET_Y])}</g>
    <line x1="${sel.line[0][0]}" y1="${sel.line[0][1]}" x2="${sel.line[1][0]}" y2="${sel.line[1][1]}" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"/>
    ${Object.keys(SEAT_CHOICES).map(id=>{ const [x,y]=place(SEAT_CHOICES[id][0]).chair, on=id===selected;
      return `<g class="chair" data-seat="${id}" role="radio" tabindex="0" aria-checked="${on}" aria-label="${SEATS[SEAT_CHOICES[id][0]].name}">
        ${on?`<circle cx="${x}" cy="${y}" r="7" fill="var(--ball)" opacity=".6"/>`:''}
        <circle class="dot" cx="${x}" cy="${y}" r="4.5" fill="${on?'var(--navy)':'var(--paper)'}" stroke="var(--navy)" stroke-width="1.5"/></g>`; }).join('')}
  </svg>`;
}
function practiceCard(){
  S.phase='idle';
  card(`
    <span class="tag">Practice</span>
    <h2>Pick your chair</h2>
    ${seatPicker(practiceSeat)}
    <span class="hint">${SEATS[SEAT_CHOICES[practiceSeat][0]].name}: you judge the ${practiceSeat==='baseline'?'baseline':practiceSeat==='service-line'?'near service line':lineName(practiceSeat,'singles')}</span>
    <div class="levels" role="radiogroup" aria-label="Level">${DAILY_LEVELS.map((l,i)=>`<button type="button" data-level="${i}" aria-pressed="${i===practiceLevel}">${l.name}</button>`).join('')}</div>
    <div class="row"><button class="btn" id="go">Start</button><button class="btn ghost" id="back">Back</button></div>
    <span class="hint">No timer, no score. Nothing here counts towards your stats.</span>
  `);
  const pick=id=>{ practiceSeat=id; practiceCard(); const c=document.querySelector(`#picker [data-seat="${id}"]`); if(c) c.focus(); };
  // a tap picks the nearest chair, so chairs that sit close together are still easy to hit
  $('picker').addEventListener('click', e=>{
    const svg=$('picker'), m=svg.getScreenCTM(); if(!m) return;
    const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
    let best=null, bd=Infinity;
    for(const g of svg.querySelectorAll('.chair')){ const c=g.querySelector('.dot'), d=Math.hypot(c.cx.baseVal.value-pt.x, c.cy.baseVal.value-pt.y); if(d<bd){ bd=d; best=g.dataset.seat; } }
    if(best && bd<24) pick(best);
  });
  for(const g of document.querySelectorAll('#picker .chair')) g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(g.dataset.seat); } });
  for(const b of document.querySelectorAll('.levels button')) b.onclick=()=>{ practiceLevel=+b.dataset.level; practiceCard(); };
  $('go').onclick=practiceStart;
  $('back').onclick=()=>intro();
}
function practiceStart(){

// ---------- Eagle-Eye review ----------
function showEagle(right, call, elapsed){
  const T=TIERS[S.tier], b=ball, mm=Math.round(Math.abs(b.m)*1000);
  const clearlyIn = b.m+2*b.ext < -LINE_W;  // the whole mark is inside the line's inner edge
  const by = clearlyIn ? 'Well inside' : (b.isIn?`${CALL.in} by ${mm} mm`:`${b.geo.axis==='y'?CALL.long:CALL.out} by ${mm} mm`);
  const dist = b.view==='side' ? b.yL : Math.hypot(b.xL-cam.x, b.yL-cam.y);
  const yours = call===null ? `No call in ${callWindow} s` : `Your call: <b>${CALL[call].toUpperCase()}</b> in ${elapsed.toFixed(2)} s`;
  const last=S.call>=T.calls, sacked=S.over>=3;
  const label = S.mode==='practice' ? 'Next ball' : S.mode==='daily' ? (S.call>=DAILY_N?'Results':'Next call') : sacked?'Continue':last?(S.tier<TIERS.length-1?'Promotion':'Finish'):'Next call';
  card(`
    <span class="tag ${right?'good':'bad'}">${right?'Good call':'Overruled'}</span>
    <div class="eagle">
      <canvas id="eagle" width="340" height="340" aria-label="Review of the bounce mark"></canvas>
      <div>
        <div class="seat">${cap(lineName(b.seat,b.match))}</div>
        <div class="verdict" style="color:${b.isIn?'var(--good)':'var(--bad)'}">${b.isIn?CALL.in:CALL.out}</div>
        <div class="mm">${by}</div>
        <div class="yours">${yours}<br>${dist.toFixed(1)} m away · ${Math.round(Math.abs(b.vy)*3.6)} km/h</div>
      </div>
    </div>
    <div class="row"><button class="btn" id="nx">${label}</button><span class="hint kbd">Space</span></div>
  `);
  drawEagle($('eagle'));
  $('nx').focus();
  $('nx').onclick=nextStep;
}
function nextStep(){
  if(S.phase!=='review') return;  // a double tap or Space+click must not skip a ball
  if(S.mode==='practice'){ startPoint(); return; }   // endless balls
  if(S.mode==='daily'){ S.call>=DAILY_N ? dailyResults() : startPoint(); return; }
  const T=TIERS[S.tier];
  S.over>=3 ? gameOver() : (S.call>=T.calls ? endTournament() : startPoint());
}
function drawEagle(c){
  const g=c.getContext('2d'), T=TIERS[S.tier], b=ball, sc=1150, SZ=340;
  const X=x=>SZ/2+(x-b.xL)*sc, Y=y=>SZ/2-(y-b.yL)*sc;
  const V=b.geo, base=V.axis==='y', o=V.line;
  g.save(); if(b.flip){ g.translate(SZ,0); g.scale(-1,1); }  // left-hand seats: the judge's mirror image
  if(base){ // court (or service box) above, the judged line across, out below (towards the judge)
    g.fillStyle=T.out; g.fillRect(0,0,SZ,SZ);
    g.fillStyle=T.court; g.fillRect(0,0,SZ,Y(o+LINE_W));
    g.fillStyle=T.line; g.fillRect(0,Y(o+LINE_W),SZ,LINE_W*sc);
  }else{ // court surface to the doubles sideline, out beyond it; singles and doubles sidelines (only one is ever in view)
    g.fillStyle=T.court; g.fillRect(0,0,SZ,SZ);
    g.fillStyle=T.out; g.fillRect(X(ALLEY+LINE_W),0,SZ,SZ);
    g.fillStyle=T.line; g.fillRect(X(0),0,LINE_W*sc,SZ); g.fillRect(X(ALLEY),0,LINE_W*sc,SZ);
  }
  // mark
  g.save(); g.translate(X(b.xL),Y(b.yL)); g.rotate(Math.atan2(-b.uy,b.ux)+Math.PI/2);
  g.beginPath(); g.ellipse(0,0,MARK_W/2*sc,b.markL/2*sc,0,0,7);
  g.fillStyle='rgba(214,226,58,.85)'; g.fill(); g.lineWidth=3; g.strokeStyle='#16221B'; g.stroke(); g.restore();
  // measurement between the mark's inner edge and the line's outer edge
  g.strokeStyle='#16221B'; g.lineWidth=1.5; g.setLineDash([5,4]);
  if(base){ // same measurement turned 90 degrees: horizontal guides, vertical arrow on the left
    const ey=Y(b.yL+b.ext), ly=Y(o), mx=46;
    g.beginPath(); g.moveTo(mx-10,ey); g.lineTo(SZ-18,ey); g.moveTo(mx-10,ly); g.lineTo(SZ-18,ly); g.stroke(); g.setLineDash([]);
    if(Math.abs(ey-ly)>6){ g.lineWidth=2; g.beginPath(); g.moveTo(mx,Math.min(ey,ly)); g.lineTo(mx,Math.max(ey,ly)); g.stroke();
      [Math.min(ey,ly),Math.max(ey,ly)].forEach((y,i)=>{ const d=i?-1:1; g.beginPath(); g.moveTo(mx,y); g.lineTo(mx-4,y+d*6); g.lineTo(mx+4,y+d*6); g.closePath(); g.fillStyle='#16221B'; g.fill(); }); }
  }else{
    const ex=X(b.xL-b.ext), lx=X(o), my=SZ-46;
    g.beginPath(); g.moveTo(ex,18); g.lineTo(ex,my+10); g.moveTo(lx,18); g.lineTo(lx,my+10); g.stroke(); g.setLineDash([]);
    if(Math.abs(ex-lx)>6){ g.lineWidth=2; g.beginPath(); g.moveTo(Math.min(ex,lx),my); g.lineTo(Math.max(ex,lx),my); g.stroke();
      [Math.min(ex,lx),Math.max(ex,lx)].forEach((x,i)=>{ const d=i?-1:1; g.beginPath(); g.moveTo(x,my); g.lineTo(x+d*6,my-4); g.lineTo(x+d*6,my+4); g.closePath(); g.fillStyle='#16221B'; g.fill(); }); }
  }
  g.restore();
  g.fillStyle='rgba(255,255,255,.92)'; g.fillRect(SZ/2-58,SZ-34,116,26);
  g.fillStyle=b.isIn?'#2F8F4E':'#C8402F'; g.font='800 18px "Barlow Condensed", sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText((b.isIn?CALL.in:CALL.out).toUpperCase()+' · '+Math.round(Math.abs(b.m)*1000)+' mm', SZ/2, SZ-21);
  g.textBaseline='alphabetic'; g.font='600 11px Barlow, sans-serif'; g.fillStyle='rgba(255,255,255,.9)';
  g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=3;  // labels stay readable where they cross a white line
  const A=SPORT.areas, up=t=>t.toUpperCase();
  if(base){ g.textAlign='left'; g.fillText(up(b.view==='svc'?A.serviceBox:A.court), 8, 16); g.fillText(up(CALL.out), 8, SZ-8); }
  else { // singles: the alley beyond the line is court-coloured but out; doubles: the alley inside the line is in
    const inner = b.match==='doubles' ? up(`${A.alley} · ${CALL.in}`) : up(A.court), outer = b.match==='doubles' ? up(CALL.out) : up(`${A.alley} · ${CALL.out}`);
    const [l,r]=b.flip?[outer,inner]:[inner,outer]; g.textAlign='left'; g.fillText(l, 8, 16); g.textAlign='right'; g.fillText(r, SZ-8, 16); }
}


// ---------- CrazyGames SDK v3 (PORTAL only) ----------
// gameplayStart when a ball is served, gameplayStop when a run or daily ends, on Home and while an ad plays;
// happytime for promotion, champion and a new badge, at most once every few seconds.
const CG = (function(){
  let sdk=null, playing=false, lastHappy=-1e9;
  const ready = !PORTAL ? Promise.resolve(null) : new Promise(res=>{
    const s=document.createElement('script'); s.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
    s.onload=async()=>{ try{ await window.CrazyGames.SDK.init(); sdk=window.CrazyGames.SDK; }catch(e){ console.warn('CrazyGames SDK init failed', e); } res(sdk); };
    s.onerror=()=>res(null); document.head.appendChild(s);
  });
  const call=fn=>{ try{ if(sdk) fn(sdk); }catch(e){ console.warn('CrazyGames SDK', e); } };
  return {
    ready, get ad(){ return sdk?.ad || null; },
    start(){ if(!sdk || playing) return; playing=true; call(s=>s.game.gameplayStart()); },
    stop(){ if(!playing) return; playing=false; call(s=>s.game.gameplayStop()); },
    happy(){ const t=performance.now(); if(t-lastHappy<3000) return; lastHappy=t; call(s=>s.game.happytime()); },
  };
})();

// ---------- Ads: one interface, a provider per platform ----------
// rewarded()  -> resolves true when the viewer earned the reward (used for "one more overrule")
// interstitial() -> resolves when the ad is closed (used between tournaments)
// Providers: AdMob inside the Capacitor apps, the CrazyGames SDK on game portals, a simulated
// ad when the page is opened with #adsim, and nothing at all otherwise (the game just skips ads).
const Ads = (function(){
  // Google's public TEST ad units. Replace with your own AdMob units before release.
  const UNITS = {
    android:{ rewarded:'ca-app-pub-3940256099942544/5224354917', interstitial:'ca-app-pub-3940256099942544/1033173712' },
    ios:    { rewarded:'ca-app-pub-3940256099942544/1712485313', interstitial:'ca-app-pub-3940256099942544/4411468910' },
  };
  const admob = ()=> window.Capacitor?.Plugins?.AdMob || null;
  const crazy = ()=> CG.ad;
  const sim   = ()=> location.hash==='#adsim';
  let ready=false;
  async function init(){
    const A=admob(); if(!A||ready) return;
    try{
      await A.initialize({});
      // EU consent (GDPR) via Google's UMP, handled by the plugin
      const info=await A.requestConsentInfo({}); if(info.isConsentFormAvailable && info.status==='REQUIRED') await A.showConsentForm();
      ready=true;
    }catch(e){ console.warn('AdMob init failed', e); }
  }
  function provider(){ return admob()?'admob':crazy()?'crazygames':sim()?'sim':null; }
  function available(){ return provider()!==null; }
  function unit(kind){ const plat=window.Capacitor?.getPlatform?.()||'android'; return (UNITS[plat]||UNITS.android)[kind]; }
  async function rewarded(){
    const p=provider();
    try{
      if(p==='admob'){
        const A=admob(); await init(); await A.prepareRewardVideoAd({ adId:unit('rewarded') });
        return await new Promise(res=>{ let got=false;
          const l1=A.addListener('onRewardedVideoAdReward',()=>{ got=true; });
          const l2=A.addListener('onRewardedVideoAdDismissed',()=>{ l1.remove(); l2.remove(); res(got); });
          A.showRewardVideoAd().catch(()=>{ l1.remove(); l2.remove(); res(false); });
        });
      }
      if(p==='crazygames') return await crazyAd('rewarded');
      if(p==='sim') return await simAd('Rewarded ad (simulated)', 4);
    }catch(e){ console.warn('rewarded ad failed', e); }
    return false;
  }
  async function interstitial(){
    const p=provider();
    try{
      if(p==='admob'){ const A=admob(); await init(); await A.prepareInterstitial({ adId:unit('interstitial') }); await A.showInterstitial(); return; }
      if(p==='crazygames'){ await crazyAd('midgame'); return; }
      if(p==='sim'){ await simAd('Interstitial ad (simulated)', 2); }
    }catch(e){ console.warn('interstitial failed', e); }
  }
  // SDK v3: ad.requestAd('rewarded' | 'midgame', callbacks); resolves true when the ad played to the end
  function crazyAd(kind){
    return new Promise(res=>crazy().requestAd(kind,{ adStarted:()=>CG.stop(), adFinished:()=>res(true), adError:e=>{ console.warn(kind+' ad error', e); res(false); } }));
  }
  function simAd(label, secs){
    return new Promise(res=>{
      const prev=$('card').innerHTML;
      $('card').innerHTML=`<span class="tag">${label}</span><h2>Your ad here</h2><p>Closes in <b id="adT">${secs}</b> s</p>`;
      $('overlay').hidden=false;
      let n=secs; const iv=setInterval(()=>{ n--; const t=$('adT'); if(t) t.textContent=n; if(n<=0){ clearInterval(iv); if($('adT')) $('card').innerHTML=prev; res(true); } },1000);
    });
  }
  return { available, rewarded, interstitial, provider };
})();

// Top-down singles court, near baseline on the left; the judged line and the chair are highlighted.
function seatDiagram(id, match){
  const k=4.4, yB=132, s=SEATS[id], V=seatGeom(s.view, match), L=-SINGLES_W;
  // world (x across, y along) -> diagram, as seen from the near end: near baseline at the bottom, far baseline at the
  // top, right sidelines on the right
  const P=([x,y])=>[50+(x-CENTRE)*k, yB-y*k].map(v=>+v.toFixed(1));
  const [rx,ry]=P([L-ALLEY,FAR_BASE]), [rx2,ry2]=P([ALLEY+LINE_W,0]);
  const tf=([x,y])=>[s.flip||s.far ? -SINGLES_W-x : x, s.far ? FAR_BASE-y : y];  // mirror / 180-degree turn
  const line = V.axis==='x' ? [[V.line-LINE_W/2,0],[V.line-LINE_W/2,FAR_BASE]] : [[V.end+LINE_W/2,V.line+LINE_W/2],[V.end-V.len+LINE_W/2,V.line+LINE_W/2]];
  const [a,b]=line.map(p=>P(tf(p))), [cx0,cy0]=P(tf(V.cam));
  const ln=(p,q)=>{ const [u,v]=P(p),[w,z]=P(q); return `<line x1="${u}" y1="${v}" x2="${w}" y2="${z}"/>`; };
  const judged=lineName(id, match);
  return `<svg class="seatmap" viewBox="0 0 100 160" width="100" height="160" role="img" aria-label="Court diagram: ${match}, judging the ${judged}">
    <rect x="${rx}" y="${ry}" width="${+(rx2-rx).toFixed(1)}" height="${+(ry2-ry).toFixed(1)}" fill="var(--paper)" stroke="var(--muted)" stroke-width="1"/>
    <g stroke="var(--muted)" stroke-width="1">${ln([0,0],[0,FAR_BASE])}${ln([L,0],[L,FAR_BASE])}${ln([L,SVC1],[0,SVC1])}${ln([L,SVC2],[0,SVC2])}${ln([CENTRE,SVC1],[CENTRE,SVC2])}</g>
    <g stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2">${ln([ALLEY+1,NET_Y],[L-ALLEY-1,NET_Y])}</g>
    <line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx0}" cy="${cy0}" r="7" fill="var(--ball)" opacity=".5"/><circle cx="${cx0}" cy="${cy0}" r="4" fill="var(--navy)"/>
  </svg><span class="hint">${cap(match)} · you judge the ${judged}</span>`;
}

// Same 20 balls for everyone on a given local calendar date; one attempt, stored the moment it starts.
function dailyToday(){
  const d=new Date(), key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(DAILY_EPOCH[0],DAILY_EPOCH[1]-1,DAILY_EPOCH[2]))/864e5)+1;
  return { key, n };
}
function seeded(str){ // FNV-1a hash of the date into mulberry32
  let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  let a=h>>>0;
  return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
}

const shiftKey = (key, n) => new Date(Date.parse(key + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);

function streakAfterPlaying(prev, today){
  if(!prev) return { last:today, n:1 };

  return { last:today, n: prev.last===shiftKey(today,-1) ? prev.n+1 : 1 };
}
function streakNow(t, today){ return t && (t.last===today || t.last===shiftKey(today,-1)) ? t.n : 0; }   // 0 once a day is missed

  S.phase='end'; R=Math.random; CG.stop();
  const r=dailyLoad()||S.daily, correct=r.results.filter(Boolean).length;
  const acc=Math.round(100*correct/DAILY_N), played=r.results.length, level=DAILY_LEVELS[r.level ?? dailyLevel(r.key)].name;
  const dots=Array.from({length:DAILY_N},(_,i)=>`<i class="${i<played?(r.results[i]?'y':'n'):''}"></i>`).join('');
  card(`
    <span class="tag ${acc>=75?'good':''}">Daily #${r.n}</span>
    <h2>${correct}/${DAILY_N} called right</h2>
    <div class="chips"><span class="chip"><b>${level}</b> level</span><span class="chip"><b>${acc}%</b> accuracy</span><span class="chip"><b>${(r.pts||0).toLocaleString()}</b> pts</span>${(n=>n?`<span class="chip"><b>${streakText(n)}</b></span>`:'')(streakNow(streakLoad(), r.key))}</div>
    <div class="dots" aria-label="Call by call results">${dots}</div>
    ${played<DAILY_N?`<span class="hint">Stopped after ${played} of ${DAILY_N}. The rest count as missed.</span>`:''}
    <div class="board" id="board"><span class="hint">Checking today's leaderboard…</span></div>
    <div class="row">${PORTAL?'<button class="btn" id="back">Back</button>':'<button class="btn" id="share">Copy result</button><button class="btn ghost" id="back">Back</button>'}</div>
    <span class="hint" id="shareMsg">Next daily in ${untilMidnight()}</span>
    <span class="hint installHint" hidden></span>
  `);
  installHint();
  if($('share')) $('share').onclick=()=> copyText(shareText(r, level, correct, todayRank && todayRank.key===r.key ? todayRank : null, location.href.split('#')[0]));
  $('back').onclick=dailyExit;
  showBoard(r, correct);
}
function dailyExit(){ goHome(); }
// Back to the start screen from anywhere: stop the ball, drop any pending review, reset the run.
// A career run's score still counts towards the best; a daily attempt stays used.
function goHome(){
  S.run++; cancelAnimationFrame(raf); clearTimeout(eagleTimer); cancelPock(); stopReplay(); resolved=true; CG.stop();
  if(S.mode==='career' && S.phase!=='end') saveBest();
  S.mode='career'; S.seat='sideline-right'; S.match='singles'; S.cond='day'; S.tier=0; S.call=0; S.over=0; S.score=0; S.streak=0; S.rescued=false; R=Math.random;
  toast(''); $('quip').hidden=true; $('timer').style.width='0%'; $('timerTrack').style.visibility=''; $('practicePanel').hidden=true; setButtons(false);
  const T=TIERS[0]; $('tName').textContent=T.name; $('tSw').style.background=T.court; $('tProg').textContent=T.surf;
  newBall(); ball.vis=false;
  hud(); drawScene(performance.now()/1000); intro();
}
function untilMidnight(){
  const d=new Date(), m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1), mins=Math.ceil((m-d)/6e4);
  return `${Math.floor(mins/60)}h ${mins%60}m`;
}
function copyText(txt){
  const fail=()=>{ $('shareMsg').textContent=txt; };
  try{ navigator.clipboard.writeText(txt).then(()=>{ $('shareMsg').textContent='Copied.'; }).catch(fail); }catch(e){ fail(); }
}
function saveBest(){
  if(S.score>S.best){ S.best=S.score; S.bestTier=S.tier; try{ localStorage.setItem('ctl.best',S.best); localStorage.setItem('ctl.tier',S.tier); }catch(e){} }
  hud();
}
function hud(){
  const practice=S.mode==='practice';   // practice keeps no score or streak, and counts balls without a total
  $('score').textContent=practice?'–':S.score.toLocaleString(); $('streak').textContent=practice?'–':S.streak; $('best').textContent=S.best.toLocaleString();
  // this call out of the tournament's (or the daily's) total, counting the ball in play; a dash before the first call
  $('callNo').textContent = !S.call ? '–' : practice ? String(S.call) : `${S.call}/${S.mode==='daily'?DAILY_N:TIERS[S.tier].calls}`;
  [...$('strikes').children].forEach((i,k)=>i.classList.toggle('hit',k<S.over));
  $('strikes').parentElement.hidden = S.mode==='daily' || practice;
}
function card(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('homeWrap').hidden=false; }
function hideOverlay(){ $('overlay').hidden=true; }

// ---------- Input ----------
$('btnIn').addEventListener('pointerdown', e=>{ e.preventDefault(); makeCall('in'); });
$('btnOut').addEventListener('pointerdown', e=>{ e.preventDefault(); makeCall('out'); });
// a tap on the court skips the ghost replay
$('court').addEventListener('pointerdown', ()=>{ if(replay) finishReplay(); });
document.addEventListener('keydown', e=>{
  if(e.repeat) return;
  const k=e.key.toLowerCase();
  if(e.key==='ArrowLeft'||k==='i') makeCall('in');
  else if(e.key==='ArrowRight'||k==='o') makeCall('out');
  // only once the review card is up: in the 0.7 s before it, #nx is still the previous card's hidden button
  else if((e.key===' '||e.key==='Enter') && replay){ e.preventDefault(); finishReplay(); }   // skip the ghost replay
  else if((e.key===' '||e.key==='Enter') && S.phase==='review' && !$('overlay').hidden){ const n=$('nx'); if(n){ e.preventDefault(); n.click(); } }
});
let homeArm=0;
$('home').onclick=()=>{
  const midRun = S.mode!=='practice' && (S.phase==='flight'||S.phase==='window'||S.phase==='review'||(S.phase==='idle'&&(S.score>0||S.tier>0)));  // practice: leave at once
  const el=$('home');
  if(midRun && !homeArm){ el.textContent='Quit run? Tap again'; el.classList.add('confirm'); homeArm=setTimeout(disarmHome,3000); return; }
  disarmHome(); goHome();
};
function disarmHome(){ clearTimeout(homeArm); homeArm=0; $('home').textContent='Home'; $('home').classList.remove('confirm'); }
$('rulesBtn').onclick=()=>{ if(S.phase==='idle'||S.phase==='end'||(S.phase==='review' && $('nx') && !$('overlay').hidden)) rulesCard(); };
$('statsBtn').onclick=()=>{ if(S.phase==='idle'||S.phase==='end'||(S.phase==='review' && $('nx') && !$('overlay').hidden)) statsCard(); };
function renderMute(){ // speaker with sound waves, or with a slash through it when muted
  const b=$('mute');
  b.innerHTML=`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 7.5h3l4.5-4v13l-4.5-4h-3z" fill="currentColor"/>${S.muted
    ? '<path d="M2 18L18 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
    : '<path d="M13 7a4.2 4.2 0 0 1 0 6M15.5 4.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'}</svg>Sound`;
  b.setAttribute('aria-pressed', String(!S.muted)); b.setAttribute('aria-label', 'Sound '+(S.muted?'off':'on'));
}
$('mute').onclick=()=>{ S.muted=!S.muted; if(S.muted) cancelPock(); renderMute(); try{localStorage.setItem('ctl.mute',S.muted?'1':'0')}catch(e){} };
renderMute();

// ---------- Boot ----------
function sportText(){ // the call buttons' words, from SPORT
  for(const [id,word] of [['btnIn',CALL.in],['btnOut',CALL.out]]){ const t=$(id).firstChild; if(t) t.nodeValue=word; }
}
function start(){ booted=true; sportText(); if(PORTAL) $('legal').hidden=true; hud(); setPitch(6); newBall(); ball.vis=false; drawScene(0); intro(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
})();
</script>
