<title>Call the Line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F0; --paper:#FFFFFF; --ink:#16221B; --muted:#5F6B63; --rule:#DCE1D8;
  --navy:#1F3A5F; --navy-ink:#F4F6F1; --ball:#D6E23A; --ball-dark:#A9B520;
  --good:#2F8F4E; --bad:#C8402F;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-block:12px 28px;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--ball);border:2px solid var(--ball-dark);display:inline-block}
.hud{display:flex;gap:18px;align-items:flex-end;font-variant-numeric:tabular-nums}
.hud .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hud .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.strikes{display:flex;gap:4px;padding-block:6px 4px}
.strikes i{width:14px;height:14px;border-radius:50%;background:var(--ball);border:2px solid var(--ball-dark);display:inline-block}
.strikes i.hit{background:var(--bad);border-color:#8E2A1E}
.stage{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(22,34,27,.06)}
.tourney{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--rule);font-size:13px}
.tourney b{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.tourney b i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tourney .prog{color:var(--muted);font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;aspect-ratio:3/2;max-width:100%;touch-action:pan-y}
.timer{height:6px;background:var(--rule)}
.timer > i{display:block;height:100%;width:0%;background:var(--good)}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.quip{position:absolute;left:0;right:0;bottom:calc(100% + 8px);display:flex;justify-content:center;pointer-events:none;transition:opacity .15s}
.quip[hidden]{display:flex!important;opacity:0}
.quip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(22,34,27,.15)}
.quip b{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px;color:var(--bad)}
.quip.ump b{color:var(--good)}
.call{appearance:none;border:0;border-radius:10px;padding:20px 10px 16px;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .06s}
.call:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.call:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.call.in{background:var(--good)} .call.out{background:var(--bad)}
.call small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.1em;opacity:.8;margin-top:6px}
.call[disabled]{opacity:.4;cursor:default;box-shadow:none}
@media (hover:none){ .call small,.hint.kbd{display:none} .call{padding:22px 10px} }
.overlay{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;padding:12px;background:rgba(243,245,240,.96);text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;margin:auto 0}
.card h2{font-family:var(--display);font-weight:800;font-size:42px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.card h2.bad{color:var(--bad)} .card h2.good{color:var(--good)}
.card p{margin:0;color:var(--muted);max-width:36ch;text-wrap:pretty}
.btn{appearance:none;border:0;border-radius:6px;background:var(--navy);color:var(--navy-ink);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase;padding:11px 26px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy);padding-block:9px}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.hint{font-size:12px;color:var(--muted)}
#shareMsg{white-space:pre-line}
.btn.big{font-size:30px;padding:14px 56px}
.btn.small{font-size:17px;padding:11px 18px} .btn.ghost.small{padding-block:10px}
.linkbtn{appearance:none;border:0;background:none;color:var(--navy);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:12px 14px;margin:-8px 0}
.start{display:flex;flex-direction:column;align-items:center;gap:8px}
/* start-screen demo, two shots per loop: an IN that clips the line, then an OUT. Each shot runs in the first half of
   its keyframes; the OUT shot (.out) is offset half a cycle with a negative delay. */
.demo{position:relative;width:100%;max-width:320px;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(22,34,27,.12)}
.demo svg{display:block;width:100%;height:auto}
.demo .shot{--x0:176px;--y0:6px;--x1:152px;--y1:74px;--x2:160px;--y2:138px;--d:0s}
.demo .out{--x0:198px;--y0:4px;--x1:170px;--y1:62px;--x2:188px;--y2:138px;--d:-2.4s}
.demo .dm-pos,.demo .dm-h,.demo .dm-mark,.demo .dm-a{animation-duration:4.8s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:var(--d)}
.demo .dm-pos{animation-name:dm-pos} .demo .dm-h{animation-name:dm-h} .demo .dm-mark{animation-name:dm-mark} .demo .dm-a{animation-name:dm-a}
.demo .dm-t{position:absolute;left:12px;top:12px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1;opacity:0}
.demo .dm-q{font-size:24px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);animation:dm-q 2.4s linear infinite}
.demo .dm-a{font-size:22px;color:var(--good);background:#fff;border-radius:999px;padding:5px 12px 4px}
.demo .dm-a.out{color:var(--bad)}
@keyframes dm-pos{0%{transform:translate(var(--x0),var(--y0)) scale(.35);opacity:0} 3%{opacity:1} 16%{transform:translate(var(--x1),var(--y1)) scale(1)} 25%{transform:translate(var(--x2),var(--y2)) scale(1.7);opacity:1} 26%,100%{opacity:0}}
@keyframes dm-h{0%{transform:translateY(-10px)} 8%{transform:translateY(-22px)} 16%{transform:translateY(0)} 25%,100%{transform:translateY(-26px)}}
@keyframes dm-mark{0%,15.5%{opacity:0} 16.5%,47%{opacity:1} 49%,100%{opacity:0}}
@keyframes dm-q{0%,38%{opacity:0} 42%,60%{opacity:1} 64%,100%{opacity:0}}
@keyframes dm-a{0%,32%{opacity:0;transform:scale(.8)} 34%{opacity:1;transform:scale(1.08)} 36%,47%{opacity:1;transform:scale(1)} 49%,100%{opacity:0}}
.rules{width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.rules b{font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy);line-height:1}
.rules span{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.chip.badge{color:var(--muted);opacity:.55}
.chip.badge.got{color:var(--good);border-color:var(--good);opacity:1;font-weight:600}
.seatmap{display:block;width:160px;height:100px;margin-bottom:-4px}
.subhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.badge-toast{position:absolute;left:0;right:0;top:46px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.badge-toast span{background:var(--ink);color:var(--ball);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 6px rgba(22,34,27,.25);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--display);font-size:15px;font-weight:800}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--navy);color:var(--navy-ink)}
.tag.bad{background:var(--bad)} .tag.good{background:var(--good)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--rule);display:inline-block}
.dots i.y{background:var(--good)} .dots i.n{background:var(--bad)}
.eagle{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px}
.eagle canvas{width:170px;height:170px;aspect-ratio:1;border-radius:6px}
.eagle .seat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.eagle .verdict{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase}
.eagle .mm{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);line-height:1.1}
.eagle .yours{font-size:13px;margin-top:8px;color:var(--muted)}
.eagle .yours b{color:var(--ink)}
.ladder{display:flex;align-items:center;width:100%;padding:4px 6px}
.ladder .st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.ladder .st i{width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--rule)}
.ladder .st.now i{width:20px;height:20px;box-shadow:0 0 0 2px var(--navy)}
.ladder .st.done i{opacity:.45}
.ladder .st span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ladder .st.now span{color:var(--ink);font-weight:600}
.ladder .ln{flex:1;height:2px;background:var(--rule);margin-bottom:16px}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
footer button{appearance:none;border:0;background:none;color:var(--navy);font:inherit;text-decoration:underline;cursor:pointer;display:inline-block;min-height:44px;padding:13px 4px;margin:-13px -4px}
footer button[disabled]{opacity:.4;text-decoration:none;cursor:default}
footer button.confirm{color:var(--bad);font-weight:600}
.toast{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.06em;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.35)}
.toast small{display:block;font-size:20px;letter-spacing:.1em;margin-top:6px}
@media (max-width:480px){
  canvas{aspect-ratio:4/5}
  .overlay{padding:10px}
  .card{gap:8px}
  .card h2{font-size:30px}
  .rules{padding:8px 10px;gap:4px 10px} .rules b{font-size:18px} .rules span{font-size:13px;line-height:1.3}
  .chips{gap:4px} .chip{font-size:11px;padding:3px 8px}
  .btn{font-size:20px;padding:10px 22px} .btn.ghost{padding-block:8px}
  #rescue{font-size:17px;padding:12px 14px}
  .tag{font-size:10px}
  .brand{font-size:26px}
  .hud{gap:12px} .hud .v{font-size:22px}
  .call{font-size:34px}
  .card h2{font-size:34px}
  .eagle{grid-template-columns:130px 1fr} .eagle canvas{width:130px;height:130px}
  .eagle .verdict{font-size:32px}
  .ladder .st span{display:none} .ladder .st.now span{display:block}
  .toast{font-size:36px}
}
@media (max-width:359px){ .eagle{grid-template-columns:1fr;justify-items:center;text-align:center} }
@media (prefers-reduced-motion:reduce){ .call{transition:none} .demo *{animation:none!important} .demo .dm-pos,.demo .out .dm-mark{opacity:0} .demo .dm-q{opacity:1} }
</style>

<div class="wrap">
  <header>
    <div class="brand"><i></i>Call the Line</div>
    <div class="hud">
      <div><div class="k">Score</div><div class="v" id="score">0</div></div>
      <div><div class="k">Streak</div><div class="v" id="streak">0</div></div>
      <div><div class="k">Best</div><div class="v" id="best">0</div></div>
      <div><div class="k">Overrules</div><div class="strikes" id="strikes"><i></i><i></i><i></i></div></div>
    </div>
  </header>

  <div class="stage">
    <div class="tourney">
      <b><i id="tSw"></i><span id="tName">Riverside Club Open</span></b>
      <span class="prog" id="tProg">Clay</span>
    </div>
    <canvas id="court" width="720" height="480" aria-label="Line judge view of a tennis sideline"></canvas>
    <div class="timer"><i id="timer"></i></div>
    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
    <div class="badge-toast" id="badgeToast" hidden aria-live="polite"></div>
  </div>

  <div class="calls">
    <div class="quip" id="quip" hidden aria-live="polite"></div>
    <button class="call in" id="btnIn" disabled>In<small>← / I</small></button>
    <button class="call out" id="btnOut" disabled>Out<small>→ / O</small></button>
  </div>

  <footer>
    <span><span id="homeWrap" hidden><button id="home" type="button">Home</button> · </span><button id="rulesBtn" type="button">Rules</button> · <button id="statsBtn" type="button">Stats</button> · <button id="mute" type="button">Sound: on</button></span>
    <span>Ball 6.7 cm · line 5 cm</span>
  </footer>
</div>

<script>
(function(){
'use strict';
// ---------- Tournament ladder ----------
const TIERS = [
  {name:'Riverside Club Open',  short:'Club',   surf:'Clay',       calls:10, court:'#C6673C', out:'#B65C34', line:'#F3EDE4', stands:'#CFC7BB', speed:[20,25], near:[2.5,5.5],  margin:[0.02,0.12],  win:2.0,  angle:0.05},
  {name:'Harbour Challenger',   short:'Chall.', surf:'Green hard', calls:10, court:'#4C8A55', out:'#7C9F60', line:'#FFFFFF', stands:'#C9D0C4', speed:[24,29], near:[3.0,7.0],  margin:[0.012,0.09], win:1.7,  angle:0.07},
  {name:'Metro Open 250',       short:'250',    surf:'Blue hard',  calls:10, court:'#3E7CBB', out:'#4F8F5F', line:'#FFFFFF', stands:'#C4CDD6', speed:[28,34], near:[3.5,8.5],  margin:[0.008,0.06], win:1.45, angle:0.09},
  {name:'Capital Masters 1000', short:'1000',   surf:'Blue hard',  calls:12, court:'#2E67A4', out:'#2B4F77', line:'#FFFFFF', stands:'#BEC7D1', speed:[32,40], near:[4.0,10.0], margin:[0.005,0.04], win:1.25, angle:0.11},
  {name:'The Grand Slam Final', short:'Slam',   surf:'Grass',      calls:12, court:'#4E8C3E', out:'#5D9C4A', line:'#FFFFFF', stands:'#C8CFC2', speed:[36,44], near:[4.5,11.0], margin:[0.002,0.03], win:1.05, angle:0.13},
];
// Daily challenge: DAILY_N balls, BALLS_PER_TIER from each tournament in order, seeded by the local calendar date.
const DAILY_N = 20, BALLS_PER_TIER = 4, DAILY_EPOCH = [2026,9,30]; // daily #1
const BALL_R = 0.0335, LINE_W = 0.05, MARK_L = 0.11, MARK_W = 0.072, G = 9.81;
const FAR_BASE = 23.77, NET_Y = 11.885, SVC1 = 5.485, SVC2 = 18.285, CENTRE = -4.115, SINGLES_W = 8.23;
// One seat per tournament (random) or per daily (from the date): the sideline (in/out across x), or centred behind
// the near baseline (long/in along y). Only the camera, the judged line and the margin axis differ. aim = metres past the
// landing spot the camera centres on.
const SEATS = { side:{ name:'Sideline', x:LINE_W/2, y:-2.6, aim:1.5 }, base:{ name:'Baseline', x:CENTRE, y:-4.2, aim:2.7 } };

// ---------- State ----------
const S = { run:0, seat:'side', mode:'career', tier:0, call:0, score:0, streak:0, over:0, best:0, bestTier:0, phase:'idle', muted:false, sound:null };
// ---------- Stats and badges (one localStorage key) ----------
const ST = { calls:0, correct:0, rtSum:0, rtN:0, bestStreak:0, closest:null, tourneys:0, perfect:0, champion:0, dailies:0, badges:[] };
try{ Object.assign(ST, JSON.parse(localStorage.getItem('ctl.stats'))||{}); if(!Array.isArray(ST.badges)) ST.badges=[]; }catch(e){}
const BADGES = [
  { id:'ten',     name:'Ten in a row',        tip:'10 correct calls in a row',                 got:s=>s.bestStreak>=10 },
  { id:'five',    name:'Called a 5 mm ball',  tip:'A correct call within 5 mm of the line',    got:s=>s.closest!==null && s.closest<=5 },
  { id:'perfect', name:'Perfect tournament',  tip:'Finish a tournament with no overrules',     got:s=>s.perfect>0 },
  { id:'slam',    name:'Grand Slam champion', tip:'Survive all five tournaments',              got:s=>s.champion>0 },
  { id:'dailies', name:'Seven dailies',       tip:'Play seven daily challenges',               got:s=>s.dailies>=7 },
];
function saveStats(){ try{ localStorage.setItem('ctl.stats', JSON.stringify(ST)); }catch(e){} }
function updateStats(fn){ fn(ST); for(const b of BADGES) if(!ST.badges.includes(b.id) && b.got(ST)){ ST.badges.push(b.id); badgeToast(b.name); } saveStats(); }
try{ S.best=+localStorage.getItem('ctl.best')||0; S.bestTier=+localStorage.getItem('ctl.tier')||0; S.muted=localStorage.getItem('ctl.mute')==='1'; }catch(e){}

const $ = id=>document.getElementById(id);
const cv = $('court'), cx = cv.getContext('2d');
let W = 720, H = 480, FPX = 1400;   // logical size follows the displayed box; focal length scales with width
let dpr = 1, booted = false;
function fit(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect(); const cw=r.width||720, ch=r.height||480;
  W=720; H=Math.round(720*ch/cw); FPX=1400;
  cv.width=W*dpr; cv.height=H*dpr;
  if(booted && S.phase!=='flight' && S.phase!=='window') drawScene(performance.now()/1000);
}
fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', ()=>setTimeout(fit,150));

// ---------- Camera: in line with the sideline, eye height 1.1 m ----------
const cam = { x:LINE_W/2, y:-2.6, z:1.1, pitch:0 };
function setPitch(centerY){ const tall=H>W; cam.pitch=Math.atan2(cam.z, (tall?centerY*0.85:centerY)-cam.y); }
function proj(x,y,z){
  const dx=x-cam.x, dy=y-cam.y, dz=z-cam.z, c=Math.cos(cam.pitch), s=Math.sin(cam.pitch);
  const depth=dy*c-dz*s, up=dy*s+dz*c, d=Math.max(depth,0.05);
  return { sx:W/2+FPX*dx/d, sy:H*0.5-FPX*up/d, d:depth };
}
function poly(pts, fill){
  cx.beginPath();
  pts.forEach((p,i)=>{ const q=proj(p[0],p[1],p[2]||0); i?cx.lineTo(q.sx,q.sy):cx.moveTo(q.sx,q.sy); });
  cx.closePath(); cx.fillStyle=fill; cx.fill();
}
function shade(hex, k){ // darken/lighten a hex colour by factor k
  const n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

// ---------- Crowd (fixed seed so it doesn't shimmer) ----------
const CROWD = []; (function(){ let s=7; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  const cols=['#5B6B7C','#8A6E5A','#A9A39A','#6E7F6A','#B08B7E','#4F5D73','#C9BFB0','#7A6A80'];
  for(let i=0;i<420;i++) CROWD.push({x:r(), row:Math.floor(r()*9), o:r(), c:cols[Math.floor(r()*cols.length)]}); })();

// ---------- Scene ----------
let ball=null, trail=[];
function drawScene(t){
  const T=TIERS[S.tier];
  cx.setTransform(dpr,0,0,dpr,0,0);
  const hz = proj(0,400,0).sy;
  // sky
  const sky=cx.createLinearGradient(0,0,0,hz-70); sky.addColorStop(0,'#EAF0F4'); sky.addColorStop(1,'#F6F7F2');
  cx.fillStyle=sky; cx.fillRect(0,0,W,hz);
  // stands: 9 seat rows rising away
  const top=hz-78;
  for(let r=0;r<9;r++){ const y=top+r*8; cx.fillStyle=r%2?shade(T.stands,0.96):T.stands; cx.fillRect(0,y,W,8); }
  cx.fillStyle='rgba(0,0,0,.05)'; cx.fillRect(0,top,W,78);
  for(const p of CROWD){ const y=top+3+p.row*8; cx.fillStyle=p.c; cx.globalAlpha=0.55+p.o*0.4; cx.beginPath(); cx.arc(p.x*W,y,2.3,0,7); cx.fill(); }
  cx.globalAlpha=1;
  // hoarding
  cx.fillStyle='#1F3A5F'; cx.fillRect(0,hz-8,W,9);
  cx.fillStyle='rgba(255,255,255,.55)'; cx.font='800 7px "Barlow Condensed", sans-serif'; cx.textAlign='left';
  for(let x=-20;x<W;x+=120) cx.fillText('CALL THE LINE', x, hz-1.5);
  if(ball && ball.seat==='base') drawBaseCourt(T, hz); else {
  // ground
  const yN=-1.4, yF=60;
  poly([[-9,yN],[0,yN],[0,yF],[-9,yF]], T.court);
  poly([[LINE_W,yN],[9,yN],[9,yF],[LINE_W,yF]], T.out);
  poly([[-9,FAR_BASE],[9,FAR_BASE],[9,yF],[-9,yF]], T.out);
  // surface texture: faint sweep lines on clay, mow stripes on grass
  if(T.surf==='Clay'){ cx.fillStyle='rgba(255,255,255,.05)'; for(let y=0;y<FAR_BASE;y+=0.6) poly([[-9,y],[0,y],[0,y+0.25],[-9,y+0.25]],'rgba(255,255,255,.04)'); }
  if(T.surf==='Grass'){ for(let y=0;y<FAR_BASE;y+=2) poly([[-9,y],[0,y],[0,y+1],[-9,y+1]],'rgba(255,255,255,.06)'); }
  // depth haze
  const hz2=cx.createLinearGradient(0,hz,0,H); hz2.addColorStop(0,'rgba(255,255,255,.28)'); hz2.addColorStop(0.35,'rgba(255,255,255,0)');
  cx.fillStyle=hz2; cx.fillRect(0,hz,W,H-hz);
  // lines
  poly([[-9,FAR_BASE],[LINE_W,FAR_BASE],[LINE_W,FAR_BASE+0.1],[-9,FAR_BASE+0.1]], T.line);
  poly([[CENTRE,SVC1],[0,SVC1],[0,SVC1+0.05],[CENTRE,SVC1+0.05]], T.line);
  poly([[CENTRE,SVC2],[0,SVC2],[0,SVC2+0.05],[CENTRE,SVC2+0.05]], T.line);
  poly([[CENTRE,SVC1],[CENTRE+0.05,SVC1],[CENTRE+0.05,SVC2],[CENTRE,SVC2]], T.line);
  poly([[0,yN],[LINE_W,yN],[LINE_W,FAR_BASE+0.1],[0,FAR_BASE+0.1]], T.line);
  // net + post
  poly([[-9,NET_Y,0],[0.95,NET_Y,0],[0.95,NET_Y,1.07],[-9,NET_Y,0.914]], 'rgba(20,30,40,.5)');
  poly([[-9,NET_Y,0.914],[0.95,NET_Y,1.07],[0.95,NET_Y,1.12],[-9,NET_Y,0.96]], '#F2F2F2');
  poly([[0.91,NET_Y,0],[0.99,NET_Y,0],[0.99,NET_Y,1.14],[0.91,NET_Y,1.14]], '#2A2F33');
  }
  // ball
  if(ball && ball.vis){
    const sh=proj(ball.x,ball.y,0), r0=FPX*BALL_R/Math.max(sh.d,0.2);
    cx.fillStyle='rgba(0,0,0,.3)'; cx.beginPath(); cx.ellipse(sh.sx,sh.sy,r0*1.1,r0*0.45,0,0,7); cx.fill();
    const q=proj(ball.x,ball.y,ball.z), r=Math.max(1.6, FPX*BALL_R/Math.max(q.d,0.2));
    if(trail.length>1){ // motion blur streak
      const p=proj(trail[0].x,trail[0].y,trail[0].z);
      cx.strokeStyle='rgba(214,226,58,.35)'; cx.lineWidth=r*1.6; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(p.sx,p.sy); cx.lineTo(q.sx,q.sy); cx.stroke();
    }
    const sq = ball.squash; // 1 = round, >1 = flattened on impact
    cx.save(); cx.translate(q.sx,q.sy); cx.scale(sq, 1/sq);
    const bg=cx.createRadialGradient(-r*.35,-r*.35,r*.2,0,0,r*1.1); bg.addColorStop(0,'#F1F87A'); bg.addColorStop(1,'#B9C51E');
    cx.fillStyle=bg; cx.beginPath(); cx.arc(0,0,r,0,7); cx.fill(); cx.restore();
  }
  // vignette + chair rail
  const vg=cx.createRadialGradient(W/2,H*0.45,H*0.35,W/2,H*0.45,H*0.95); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.18)');
  cx.fillStyle=vg; cx.fillRect(0,0,W,H);
  cx.fillStyle='#16221B'; cx.fillRect(0,H-16,W,16);
  cx.fillStyle='rgba(255,255,255,.12)'; cx.fillRect(0,H-16,W,2);
  cx.fillStyle='#D6E23A'; cx.font='800 10px "Barlow Condensed", sans-serif'; cx.textAlign='left'; cx.fillText('LINE JUDGE · '+SEATS[ball?ball.seat:'side'].name.toUpperCase(), 10, H-5);
  const total = S.mode==='daily' ? DAILY_N : T.calls;
  cx.fillStyle='#F4F6F1'; cx.textAlign='right'; cx.fillText(`CALL ${Math.min(S.call,total)} OF ${total}`, W-10, H-5);
}
function drawBaseCourt(T, hz){ // view from behind the near baseline: both singles sidelines, baseline across the view
  const L=-SINGLES_W, yN=cam.y+1.2, yF=60, BW=LINE_W;
  poly([[-20,yN],[14,yN],[14,yF],[-20,yF]], T.out);
  poly([[L,0],[LINE_W,0],[LINE_W,FAR_BASE],[L,FAR_BASE]], T.court);
  if(T.surf==='Clay'){ for(let y=0;y<FAR_BASE;y+=0.6) poly([[L,y],[LINE_W,y],[LINE_W,y+0.25],[L,y+0.25]],'rgba(255,255,255,.04)'); }
  if(T.surf==='Grass'){ for(let y=0;y<FAR_BASE;y+=2) poly([[L,y],[LINE_W,y],[LINE_W,y+1],[L,y+1]],'rgba(255,255,255,.06)'); }
  const hz2=cx.createLinearGradient(0,hz,0,H); hz2.addColorStop(0,'rgba(255,255,255,.28)'); hz2.addColorStop(0.35,'rgba(255,255,255,0)');
  cx.fillStyle=hz2; cx.fillRect(0,hz,W,H-hz);
  // the judged line: near baseline, outer edge at y=0, line runs into the court to y=BW
  poly([[L,0],[LINE_W,0],[LINE_W,BW],[L,BW]], T.line);
  poly([[L,FAR_BASE],[LINE_W,FAR_BASE],[LINE_W,FAR_BASE+0.1],[L,FAR_BASE+0.1]], T.line);
  poly([[0,0],[LINE_W,0],[LINE_W,FAR_BASE+0.1],[0,FAR_BASE+0.1]], T.line);
  poly([[L,0],[L+LINE_W,0],[L+LINE_W,FAR_BASE+0.1],[L,FAR_BASE+0.1]], T.line);
  poly([[L,SVC1],[0,SVC1],[0,SVC1+0.05],[L,SVC1+0.05]], T.line);
  poly([[L,SVC2],[0,SVC2],[0,SVC2+0.05],[L,SVC2+0.05]], T.line);
  poly([[CENTRE,SVC1],[CENTRE+0.05,SVC1],[CENTRE+0.05,SVC2],[CENTRE,SVC2]], T.line);
  // net sagging from 1.07 m at the posts to 0.914 m at the centre, posts both sides
  const pl=L-0.95, pr=0.95;
  poly([[pl,NET_Y,0],[pr,NET_Y,0],[pr,NET_Y,1.07],[CENTRE,NET_Y,0.914],[pl,NET_Y,1.07]], 'rgba(20,30,40,.2)'); // seen face-on: lighter mesh
  poly([[pl,NET_Y,1.07],[CENTRE,NET_Y,0.914],[CENTRE,NET_Y,0.96],[pl,NET_Y,1.12]], '#F2F2F2');
  poly([[CENTRE,NET_Y,0.914],[pr,NET_Y,1.07],[pr,NET_Y,1.12],[CENTRE,NET_Y,0.96]], '#F2F2F2');
  poly([[pl-0.04,NET_Y,0],[pl+0.04,NET_Y,0],[pl+0.04,NET_Y,1.14],[pl-0.04,NET_Y,1.14]], '#2A2F33');
  poly([[pr-0.04,NET_Y,0],[pr+0.04,NET_Y,0],[pr+0.04,NET_Y,1.14],[pr-0.04,NET_Y,1.14]], '#2A2F33');
}

// ---------- Ball ----------
let R=Math.random; // swapped for a seeded generator during the daily challenge
const rnd=(a,b)=>a+R()*(b-a);
function newBall(){
  const T=TIERS[S.tier], seat=S.seat, St=SEATS[seat];
  cam.x=St.x; cam.y=St.y;
  // along the judged line: distance down the sideline, or across the baseline within the judge's view
  const vy=-rnd(T.speed[0],T.speed[1]), along = seat==='side' ? rnd(T.near[0],T.near[1]) : CENTRE+rnd(-0.7,0.7);
  const ang=rnd(T.angle*0.4,T.angle)*(R()<0.5?-1:1), vx=ang*Math.abs(vy);
  const len=Math.hypot(vx,vy), ux=vx/len, uy=vy/len;
  // half-extent of the elongated mark across the judged line (x for the sideline, y for the baseline)
  const ext = seat==='side' ? Math.hypot(MARK_L/2*ux, MARK_W/2*uy) : Math.hypot(MARK_L/2*uy, MARK_W/2*ux);
  // margin between the mark's inner edge and the line's outer edge: negative = in, positive = out
  const m = R()<0.22 ? rnd(0.06,0.22)*(R()<0.5?-1:1) : rnd(T.margin[0],T.margin[1])*(R()<0.5?-1:1);
  const xL = seat==='side' ? LINE_W+m+ext : along, yL = seat==='side' ? along : -m-ext;  // baseline outer edge at y=0, out is y<0
  setPitch(yL+St.aim);
  const a=0.21*Math.abs(vy), spawn=14;
  ball={ xL, yL, vx, vy, a, b:0.55*a, t0:-spawn/Math.abs(vy), x:0,y:0,z:0, vis:true, ux, uy, ext, seat, m, isIn:m<0, squash:1 };
  trail=[];
}
function stepBall(t){
  const b=ball;
  b.x=b.xL+b.vx*t; b.y=b.yL+b.vy*t;
  b.z = t<0 ? -b.a*t : Math.max(0, b.b*t-0.5*G*t*t);
  b.squash = (t>=0 && t<0.045) ? 1.35 : 1;
  b.vis = b.y > cam.y+0.4;
  trail.push({x:b.x,y:b.y,z:b.z}); if(trail.length>4) trail.shift();
}

// ---------- Audio ----------
function unlockAudio(){ // mobile browsers only start audio from a user gesture
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const b=S.sound.createBuffer(1,1,22050), src=S.sound.createBufferSource(); src.buffer=b; src.connect(S.sound.destination); src.start(0);
    if(S.sound.state==='running') UNLOCK_EVENTS.forEach(ev=>document.removeEventListener(ev, unlockAudio));
  }catch(e){}
}
const UNLOCK_EVENTS=['pointerdown','pointerup','touchend','click','keydown'];
UNLOCK_EVENTS.forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
function pock(){
  if(S.muted) return;
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const ac=S.sound, o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type='triangle'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(140,t+0.08);
    g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t+0.13);
  }catch(e){}
}
// Reactions: the crowd murmurs after an overrule, the umpire chimes after a close good call
function murmur(){ // ~1 s of low filtered noise
  if(S.muted) return;
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const ac=S.sound, t=ac.currentTime, len=Math.floor(ac.sampleRate*1.1), buf=ac.createBuffer(1,len,ac.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const src=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    src.buffer=buf; f.type='bandpass'; f.frequency.value=320; f.Q.value=0.8;
    g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.28,t+0.25); g.gain.exponentialRampToValueAtTime(0.001,t+1.05);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+1.1);
  }catch(e){}
}
function chime(){ // two soft rising notes
  if(S.muted) return;
  try{
    if(!S.sound) S.sound=new (window.AudioContext||window.webkitAudioContext)();
    if(S.sound.state==='suspended') S.sound.resume();
    const ac=S.sound, t=ac.currentTime;
    [[660,0],[990,0.09]].forEach(([hz,dt])=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=hz;
      g.gain.setValueAtTime(0.001,t+dt); g.gain.exponentialRampToValueAtTime(0.18,t+dt+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.22);
      o.connect(g); g.connect(ac.destination); o.start(t+dt); o.stop(t+dt+0.24);
    });
  }catch(e){}
}

// ---------- Loop ----------
let raf=0, tStart=0, callWindow=1, callT=0, resolved=false, eagleTimer=0;
function loop(ts){
  const t=(ts-tStart)/1000+ball.t0;
  if(S.phase==='flight'||S.phase==='window'){
    stepBall(t);
    if(S.phase==='flight'&&t>=0){ S.phase='window'; callT=ts; pock(); setButtons(true); }
    if(S.phase==='window'){
      const el=(ts-callT)/1000, left=Math.max(0,1-el/callWindow);
      const bar=$('timer'); bar.style.width=left*100+'%'; bar.style.background = left<0.3?'var(--bad)':left<0.6?'#D28B1C':'var(--good)';
      if(el>=callWindow) resolve(null, el);
    }
  }
  drawScene(ts/1000);
  if(S.phase==='flight'||S.phase==='window') raf=requestAnimationFrame(loop);
}
function startPoint(){
  S.call++;
  if(S.mode==='daily'){ S.tier=Math.min(TIERS.length-1, Math.floor((S.call-1)/BALLS_PER_TIER)); $('tSw').style.background=TIERS[S.tier].court; }
  const T=TIERS[S.tier];
  $('tProg').textContent = `${T.surf} · call ${S.call} of ${S.mode==='daily'?DAILY_N:T.calls} · ${SEATS[S.seat].name}`;
  newBall(); callWindow=T.win; resolved=false;
  $('timer').style.width='100%'; setButtons(false); hideOverlay(); toast('');
  clearTimeout(quipTimer); $('quip').hidden=true;
  S.phase='flight'; tStart=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function setButtons(on){ $('btnIn').disabled=!on; $('btnOut').disabled=!on; $('rulesBtn').disabled=on; $('statsBtn').disabled=on; }
function makeCall(c){ if(S.phase!=='window'||resolved) return; resolve(c,(performance.now()-callT)/1000); }
function resolve(call, elapsed){
  resolved=true; S.phase='review'; setButtons(false);
  cancelAnimationFrame(raf); drawScene(performance.now()/1000);  // last frame; nothing moves under the cards
  const right = call!==null && (call==='in')===ball.isIn;
  if(right){
    S.streak++;
    const mult=1+Math.min(4,Math.floor(S.streak/3))*0.5, speed=Math.round(100*Math.max(0,1-elapsed/callWindow));
    const pts=Math.round((100+speed)*mult); S.score+=pts;
    toast(call, `+${pts}`);
  }else{
    S.streak=0; if(S.mode!=='daily') S.over++;
    toast(call===null?'No call':call, 'Overruled');
  }
  if(S.mode==='daily') dailyRecord(right);
  updateStats(st=>{
    st.calls++; if(call!==null){ st.rtSum+=elapsed; st.rtN++; }
    if(right){ st.correct++; st.bestStreak=Math.max(st.bestStreak,S.streak); const mm=Math.abs(ball.m)*1000; if(st.closest===null||mm<st.closest) st.closest=mm; }
  });
  if(!right){ murmur(); quip('Player', pickQuote(), false); }
  else if(Math.abs(ball.m)<=0.005){ chime(); quip('Umpire', 'Good eyes.', true); }
  hud();
  eagleTimer=setTimeout(()=>showEagle(right,call,elapsed), 700);
}
const QUOTES = ['You cannot be serious.','Are you watching the same match?','Were you even looking?','Get your eyes checked.',
  'Is that chair comfortable?','Wake up, line!','How much are they paying you?','Unbelievable. Just unbelievable.'];
let lastQuote=-1, quipTimer=0;
function pickQuote(){ let i; do{ i=Math.floor(Math.random()*QUOTES.length); }while(i===lastQuote); lastQuote=i; return QUOTES[i]; }
function quip(who, line, ump){
  const el=$('quip'); el.innerHTML=`<span><b>${who}</b>“${line}”</span>`; el.classList.toggle('ump',ump); el.hidden=false;
  clearTimeout(quipTimer); quipTimer=setTimeout(()=>{ el.hidden=true; },1500);
}
function toast(big, small){ const el=$('toast'); el.innerHTML = big ? `${big}<small>${small||''}</small>` : ''; el.hidden=!big; }

// ---------- Eagle-Eye review ----------
function showEagle(right, call, elapsed){
  const T=TIERS[S.tier], b=ball, mm=Math.round(Math.abs(b.m)*1000);
  const clearlyIn = b.m+2*b.ext < -LINE_W;  // the whole mark is inside the line's inner edge
  const by = clearlyIn ? 'Well inside' : (b.isIn?`In by ${mm} mm`:`${b.seat==='base'?'Long':'Out'} by ${mm} mm`);
  const dist = b.seat==='side' ? b.yL : Math.hypot(b.xL-cam.x, b.yL-cam.y);
  const yours = call===null ? `No call in ${callWindow} s` : `Your call: <b>${call.toUpperCase()}</b> in ${elapsed.toFixed(2)} s`;
  const last=S.call>=T.calls, sacked=S.over>=3;
  const label = S.mode==='daily' ? (S.call>=DAILY_N?'Results':'Next call') : sacked?'Continue':last?(S.tier<TIERS.length-1?'Promotion':'Finish'):'Next call';
  card(`
    <span class="tag ${right?'good':'bad'}">${right?'Good call':'Overruled'}</span>
    <div class="eagle">
      <canvas id="eagle" width="340" height="340" aria-label="Review of the bounce mark"></canvas>
      <div>
        <div class="seat">${SEATS[b.seat].name} judge</div>
        <div class="verdict" style="color:${b.isIn?'var(--good)':'var(--bad)'}">${b.isIn?'In':'Out'}</div>
        <div class="mm">${by}</div>
        <div class="yours">${yours}<br>${dist.toFixed(1)} m away · ${Math.round(Math.abs(b.vy)*3.6)} km/h</div>
      </div>
    </div>
    <div class="row"><button class="btn" id="nx">${label}</button><span class="hint kbd">Space</span></div>
  `);
  drawEagle($('eagle'));
  $('nx').focus();
  $('nx').onclick=nextStep;
}
function nextStep(){
  if(S.phase!=='review') return;  // a double tap or Space+click must not skip a ball
  if(S.mode==='daily'){ S.call>=DAILY_N ? dailyResults() : startPoint(); return; }
  const T=TIERS[S.tier];
  S.over>=3 ? gameOver() : (S.call>=T.calls ? endTournament() : startPoint());
}
function drawEagle(c){
  const g=c.getContext('2d'), T=TIERS[S.tier], b=ball, sc=1150, SZ=340;
  const X=x=>SZ/2+(x-b.xL)*sc, Y=y=>SZ/2-(y-b.yL)*sc;
  const base = b.seat==='base';
  if(base){ // court above (far side), baseline across, out below (towards the judge)
    g.fillStyle=T.out; g.fillRect(0,0,SZ,SZ);
    g.fillStyle=T.court; g.fillRect(0,0,SZ,Y(LINE_W));
    g.fillStyle=T.line; g.fillRect(0,Y(LINE_W),SZ,LINE_W*sc);
  }else{
    g.fillStyle=T.court; g.fillRect(0,0,SZ,SZ);
    g.fillStyle=T.out; g.fillRect(X(LINE_W),0,SZ,SZ);
    g.fillStyle=T.line; g.fillRect(X(0),0,LINE_W*sc,SZ);
  }
  // mark
  g.save(); g.translate(X(b.xL),Y(b.yL)); g.rotate(Math.atan2(-b.uy,b.ux)+Math.PI/2);
  g.beginPath(); g.ellipse(0,0,MARK_W/2*sc,MARK_L/2*sc,0,0,7);
  g.fillStyle='rgba(214,226,58,.85)'; g.fill(); g.lineWidth=3; g.strokeStyle='#16221B'; g.stroke(); g.restore();
  // measurement between the mark's inner edge and the line's outer edge
  g.strokeStyle='#16221B'; g.lineWidth=1.5; g.setLineDash([5,4]);
  if(base){ // same measurement turned 90 degrees: horizontal guides, vertical arrow on the left
    const ey=Y(b.yL+b.ext), ly=Y(0), mx=46;
    g.beginPath(); g.moveTo(mx-10,ey); g.lineTo(SZ-18,ey); g.moveTo(mx-10,ly); g.lineTo(SZ-18,ly); g.stroke(); g.setLineDash([]);
    if(Math.abs(ey-ly)>6){ g.lineWidth=2; g.beginPath(); g.moveTo(mx,Math.min(ey,ly)); g.lineTo(mx,Math.max(ey,ly)); g.stroke();
      [Math.min(ey,ly),Math.max(ey,ly)].forEach((y,i)=>{ const d=i?-1:1; g.beginPath(); g.moveTo(mx,y); g.lineTo(mx-4,y+d*6); g.lineTo(mx+4,y+d*6); g.closePath(); g.fillStyle='#16221B'; g.fill(); }); }
  }else{
    const ex=X(b.xL-b.ext), lx=X(LINE_W), my=SZ-46;
    g.beginPath(); g.moveTo(ex,18); g.lineTo(ex,my+10); g.moveTo(lx,18); g.lineTo(lx,my+10); g.stroke(); g.setLineDash([]);
    if(Math.abs(ex-lx)>6){ g.lineWidth=2; g.beginPath(); g.moveTo(Math.min(ex,lx),my); g.lineTo(Math.max(ex,lx),my); g.stroke();
      [Math.min(ex,lx),Math.max(ex,lx)].forEach((x,i)=>{ const d=i?-1:1; g.beginPath(); g.moveTo(x,my); g.lineTo(x+d*6,my-4); g.lineTo(x+d*6,my+4); g.closePath(); g.fillStyle='#16221B'; g.fill(); }); }
  }
  g.fillStyle='rgba(255,255,255,.92)'; g.fillRect(SZ/2-58,SZ-34,116,26);
  g.fillStyle=b.isIn?'#2F8F4E':'#C8402F'; g.font='800 18px "Barlow Condensed", sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText((b.isIn?'IN':'OUT')+' · '+Math.round(Math.abs(b.m)*1000)+' mm', SZ/2, SZ-21);
  g.textBaseline='alphabetic'; g.font='600 11px Barlow, sans-serif'; g.fillStyle='rgba(255,255,255,.9)';
  g.textAlign='left'; g.fillText('COURT', 8, 16);
  if(base) g.fillText('OUT', 8, SZ-8); else { g.textAlign='right'; g.fillText('OUT', SZ-8, 16); }
}


// ---------- Ads: one interface, a provider per platform ----------
// rewarded()  -> resolves true when the viewer earned the reward (used for "one more overrule")
// interstitial() -> resolves when the ad is closed (used between tournaments)
// Providers: AdMob inside the Capacitor apps, the CrazyGames SDK on game portals, a simulated
// ad when the page is opened with #adsim, and nothing at all otherwise (the game just skips ads).
const Ads = (function(){
  // Google's public TEST ad units. Replace with your own AdMob units before release.
  const UNITS = {
    android:{ rewarded:'ca-app-pub-3940256099942544/5224354917', interstitial:'ca-app-pub-3940256099942544/1033173712' },
    ios:    { rewarded:'ca-app-pub-3940256099942544/1712485313', interstitial:'ca-app-pub-3940256099942544/4411468910' },
  };
  const admob = ()=> window.Capacitor?.Plugins?.AdMob || null;
  const crazy = ()=> window.CrazyGames?.SDK?.ad || null;
  const sim   = ()=> location.hash==='#adsim';
  let ready=false;
  async function init(){
    const A=admob(); if(!A||ready) return;
    try{
      await A.initialize({});
      // EU consent (GDPR) via Google's UMP, handled by the plugin
      const info=await A.requestConsentInfo({}); if(info.isConsentFormAvailable && info.status==='REQUIRED') await A.showConsentForm();
      ready=true;
    }catch(e){ console.warn('AdMob init failed', e); }
  }
  function provider(){ return admob()?'admob':crazy()?'crazygames':sim()?'sim':null; }
  function available(){ return provider()!==null; }
  function unit(kind){ const plat=window.Capacitor?.getPlatform?.()||'android'; return (UNITS[plat]||UNITS.android)[kind]; }
  async function rewarded(){
    const p=provider();
    try{
      if(p==='admob'){
        const A=admob(); await init(); await A.prepareRewardVideoAd({ adId:unit('rewarded') });
        return await new Promise(res=>{ let got=false;
          const l1=A.addListener('onRewardedVideoAdReward',()=>{ got=true; });
          const l2=A.addListener('onRewardedVideoAdDismissed',()=>{ l1.remove(); l2.remove(); res(got); });
          A.showRewardVideoAd().catch(()=>{ l1.remove(); l2.remove(); res(false); });
        });
      }
      if(p==='crazygames') return await new Promise(res=>crazy().requestAd('rewarded',{ adFinished:()=>res(true), adError:()=>res(false), adStarted:()=>{} }));
      if(p==='sim') return await simAd('Rewarded ad (simulated)', 4);
    }catch(e){ console.warn('rewarded ad failed', e); }
    return false;
  }
  async function interstitial(){
    const p=provider();
    try{
      if(p==='admob'){ const A=admob(); await init(); await A.prepareInterstitial({ adId:unit('interstitial') }); await A.showInterstitial(); return; }
      if(p==='crazygames'){ await new Promise(res=>crazy().requestAd('midgame',{ adFinished:res, adError:res, adStarted:()=>{} })); return; }
      if(p==='sim'){ await simAd('Interstitial ad (simulated)', 2); }
    }catch(e){ console.warn('interstitial failed', e); }
  }
  function simAd(label, secs){
    return new Promise(res=>{
      const prev=$('card').innerHTML;
      $('card').innerHTML=`<span class="tag">${label}</span><h2>Your ad here</h2><p>Closes in <b id="adT">${secs}</b> s</p>`;
      $('overlay').hidden=false;
      let n=secs; const iv=setInterval(()=>{ n--; const t=$('adT'); if(t) t.textContent=n; if(n<=0){ clearInterval(iv); if($('adT')) $('card').innerHTML=prev; res(true); } },1000);
    });
  }
  return { available, rewarded, interstitial, provider };
})();

// Top-down singles court, near baseline on the left; the judged line and the chair are highlighted.
function seatDiagram(seat){
  const k=5, x0=30, y0=50-SINGLES_W*k/2, len=FAR_BASE*k, wid=SINGLES_W*k, sv=(NET_Y-SVC1)*k, net=x0+NET_Y*k;
  const judged = seat==='side' ? `<line x1="${x0}" y1="${y0+wid}" x2="${x0+len}" y2="${y0+wid}"/>` : `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0+wid}"/>`;
  const chair = seat==='side' ? [x0+SEATS.side.y*k, y0+wid] : [x0+SEATS.base.y*k, 50];
  return `<svg class="seatmap" viewBox="0 0 160 100" width="160" height="100" role="img" aria-label="Court diagram showing the ${SEATS[seat].name.toLowerCase()} judge's chair">
    <rect x="${x0}" y="${y0}" width="${len}" height="${wid}" fill="var(--paper)" stroke="var(--muted)" stroke-width="1"/>
    <g stroke="var(--muted)" stroke-width="1"><line x1="${net-sv}" y1="${y0}" x2="${net-sv}" y2="${y0+wid}"/><line x1="${net+sv}" y1="${y0}" x2="${net+sv}" y2="${y0+wid}"/><line x1="${net-sv}" y1="50" x2="${net+sv}" y2="50"/></g>
    <line x1="${net}" y1="${y0-5}" x2="${net}" y2="${y0+wid+5}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <g stroke="var(--navy)" stroke-width="3" stroke-linecap="round">${judged}</g>
    <circle cx="${chair[0]}" cy="${chair[1]}" r="7" fill="var(--ball)" opacity=".5"/><circle cx="${chair[0]}" cy="${chair[1]}" r="4" fill="var(--navy)"/>
  </svg><span class="hint">Your seat: ${SEATS[seat].name.toLowerCase()}</span>`;
}
function previewSeat(seat){ S.seat=seat; S.call=0; newBall(); ball.vis=false; drawScene(performance.now()/1000); }
function dailySeat(key){ return seeded('ctl-daily-seat-'+key)()<0.5 ? 'side' : 'base'; }  // own stream: the ball sequence is untouched
function rulesCard(){ sideCard(`<h2>Rules</h2>${RULES}<div class="row"><button class="btn" id="go">Back</button></div>`); }

let badgeQueue=[], badgeBusy=false;
function badgeToast(name){ badgeQueue.push(name); if(!badgeBusy) nextBadge(); }

function startTournament(){
  const T=TIERS[S.tier], seat=Math.random()<0.5?'side':'base'; S.call=0; S.over=0; hud();

function endTournament(){

  if(S.tier>=TIERS.length-1){ win(); return; }
  const bonus=(3-S.over)*250; S.score+=bonus; hud();
  const T=TIERS[S.tier]; S.tier++;
  card(`
    <span class="tag good">Promoted</span>

  `);
  $('go').onclick=async()=>{ const run=S.run; $('go').disabled=true; await Ads.interstitial(); if(run===S.run) startTournament(); };
}
function gameOver(){
  S.phase='end';
  const canRescue = Ads.available() && !S.rescued;
  card(`
    <span class="tag bad">Rule 3</span>
    <h2 class="bad">Three overrules. The cameras take over.</h2>
    <div class="chips"><span class="chip"><b>${S.score.toLocaleString()}</b> pts</span><span class="chip">call <b>${S.call}</b> of ${TIERS[S.tier].name}</span></div>

    <div class="row"><button class="btn ${canRescue?'ghost':''}" id="again">Try again</button><button class="btn ghost" id="share">Copy score</button></div>
    <span class="hint" id="shareMsg"></span>
  `);
  if(canRescue) $('rescue').onclick=async()=>{
    $('rescue').disabled=true;
    const run=S.run, ok=await Ads.rewarded();

    S.rescued=true; S.over=2; hud();
    const T=TIERS[S.tier];
    if(S.call>=T.calls) endTournament(); else startPoint();
  };

}
function win(){
  S.phase='end'; saveBest();

    <span class="tag good">Champion</span>

function wireEnd(){

}
// ---------- Daily challenge ----------
// Same 20 balls for everyone on a given local calendar date; one attempt, stored the moment it starts.
function dailyToday(){
  const d=new Date(), key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(DAILY_EPOCH[0],DAILY_EPOCH[1]-1,DAILY_EPOCH[2]))/864e5)+1;
  return { key, n };
}
function seeded(str){ // FNV-1a hash of the date into mulberry32
  let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  let a=h>>>0;
  return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
}
function dailyLoad(){ // today's stored attempt, or null
  try{ const r=JSON.parse(localStorage.getItem('ctl.daily')); return r && r.key===dailyToday().key ? r : null; }catch(e){ return null; }
}
function dailySave(){ try{ localStorage.setItem('ctl.daily', JSON.stringify(S.daily)); }catch(e){} }
function dailyIntro(){
  S.phase='idle'; S.mode='daily';
  const { key, n }=dailyToday(), seat=dailySeat(key);
  S.tier=0; previewSeat(seat);
  card(`
    <span class="tag">Daily challenge</span>
    <h2>Daily #${n}</h2>
    <p>Same ${DAILY_N} balls for everyone today. One attempt.</p>
    ${seatDiagram(seat)}
    <div class="row"><button class="btn" id="go">Start</button><button class="btn ghost" id="back">Back</button></div>
  `);
  $('go').onclick=dailyStart;
  $('back').onclick=dailyExit;
}
function dailyStart(){
  if(dailyLoad()){ dailyResults(); return; }
  const { key, n }=dailyToday();
  R=seeded('ctl-daily-'+key);
  S.mode='daily'; S.seat=dailySeat(key); S.tier=0; S.call=0; S.over=0; S.score=0; S.streak=0;
  S.daily={ key, n, results:[], pts:0 };
  dailySave(); updateStats(st=>{ st.dailies++; });
  $('tName').textContent=`Daily #${n}`; hud();
  startPoint();
}
function dailyRecord(right){ S.daily.results.push(right); S.daily.pts=S.score; dailySave(); }
function dailyResults(){
  S.phase='end'; R=Math.random;
  const r=dailyLoad()||S.daily, correct=r.results.filter(Boolean).length;
  const acc=Math.round(100*correct/DAILY_N), played=r.results.length;
  const dots=Array.from({length:DAILY_N},(_,i)=>`<i class="${i<played?(r.results[i]?'y':'n'):''}"></i>`).join('');
  card(`
    <span class="tag ${acc>=75?'good':''}">Daily #${r.n}</span>
    <h2>${correct}/${DAILY_N} called right</h2>
    <div class="chips"><span class="chip"><b>${acc}%</b> accuracy</span><span class="chip"><b>${(r.pts||0).toLocaleString()}</b> pts</span></div>
    <div class="dots" aria-label="Call by call results">${dots}</div>
    ${played<DAILY_N?`<span class="hint">Stopped after ${played} of ${DAILY_N}. The rest count as missed.</span>`:''}
    <div class="row"><button class="btn" id="share">Copy result</button><button class="btn ghost" id="back">Back</button></div>
    <span class="hint" id="shareMsg">Next daily in ${untilMidnight()}</span>
  `);
  $('share').onclick=()=>{
    const grid=Array.from({length:DAILY_N},(_,i)=>r.results[i]?'🟩':'🟥').join('');
    copyText(`Call the Line daily #${r.n}: ${correct}/${DAILY_N}\n${grid}\n${location.href.split('#')[0]}`);
  };
  $('back').onclick=dailyExit;
}
function dailyExit(){ goHome(); }
// Back to the start screen from anywhere: stop the ball, drop any pending review, reset the run.
// A career run's score still counts towards the best; a daily attempt stays used.
function goHome(){
  S.run++; cancelAnimationFrame(raf); clearTimeout(eagleTimer); resolved=true;
  if(S.mode==='career' && S.phase!=='end') saveBest();
  S.mode='career'; S.seat='side'; S.tier=0; S.call=0; S.over=0; S.score=0; S.streak=0; S.rescued=false; R=Math.random;
  toast(''); $('quip').hidden=true; $('timer').style.width='0%'; setButtons(false);
  const T=TIERS[0]; $('tName').textContent=T.name; $('tSw').style.background=T.court; $('tProg').textContent=T.surf;
  newBall(); ball.vis=false;
  hud(); drawScene(performance.now()/1000); intro();
}
function untilMidnight(){
  const d=new Date(), m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1), mins=Math.ceil((m-d)/6e4);
  return `${Math.floor(mins/60)}h ${mins%60}m`;
}
function copyText(txt){
  const fail=()=>{ $('shareMsg').textContent=txt; };
  try{ navigator.clipboard.writeText(txt).then(()=>{ $('shareMsg').textContent='Copied.'; }).catch(fail); }catch(e){ fail(); }
}
function saveBest(){
  if(S.score>S.best){ S.best=S.score; S.bestTier=S.tier; try{ localStorage.setItem('ctl.best',S.best); localStorage.setItem('ctl.tier',S.tier); }catch(e){} }

}
function hud(){
  $('score').textContent=S.score.toLocaleString(); $('streak').textContent=S.streak; $('best').textContent=S.best.toLocaleString();
  [...$('strikes').children].forEach((i,k)=>i.classList.toggle('hit',k<S.over));
  $('strikes').parentElement.hidden = S.mode==='daily';
}
function card(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('homeWrap').hidden=false; }
function hideOverlay(){ $('overlay').hidden=true; }

// ---------- Input ----------
$('btnIn').addEventListener('pointerdown', e=>{ e.preventDefault(); makeCall('in'); });
$('btnOut').addEventListener('pointerdown', e=>{ e.preventDefault(); makeCall('out'); });
document.addEventListener('keydown', e=>{

let homeArm=0;
$('home').onclick=()=>{

$('rulesBtn').onclick=()=>{ if(S.phase==='idle'||(S.phase==='review' && $('nx') && !$('overlay').hidden)) rulesCard(); };

$('mute').textContent='Sound: '+(S.muted?'off':'on');

function start(){ booted=true; hud(); setPitch(6); newBall(); ball.vis=false; drawScene(0); intro(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
