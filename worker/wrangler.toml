# Call the Line daily leaderboard Worker. Deploy steps are in the README ("Daily leaderboard").
name = "call-the-line-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Serves https://api.calltheline.site; needs the calltheline.site zone in the same Cloudflare account.
# Without it, delete this block and use the workers.dev URL that `wrangler deploy` prints as API_BASE in src/game.html.
routes = [
  { pattern = "api.calltheline.site", custom_domain = true }
]

[vars]
# Comma-separated origins browsers may call the API from; the Worker echoes back the matching one, and any other
# origin gets no CORS headers. Here: the site, its www name, the GitHub Pages copy, the Capacitor apps (iOS uses
# capacitor://localhost, Android https://localhost) and the local dev server.
ALLOWED_ORIGIN = "https://calltheline.site,https://www.calltheline.site,https://kwy8.github.io,capacitor://localhost,https://localhost,http://localhost:3000"

[[kv_namespaces]]
binding = "LEADERBOARD"
# Created with: npx wrangler kv namespace create LEADERBOARD
id = "ad15bd2bd3c24ce094d0200ea351cf2e"
